<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nptel/wrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'JetBrains Mono','Cascadia Code','Cascadia Mono',Consolas,'SF Mono',ui-monospace,Menlo,monospace;
  --r:6px;
}
html.dark{color-scheme:dark;
  --bg:#0b0c0e;--side:#0e1013;--panel:#13161a;--hover:#191c21;--line:#21252b;--line2:#2c3139;
  --text:#e3e5e8;--dim:#9198a3;--faint:#5d636d;
  --acc:#4ade80;--acc2:#22c55e;--accsoft:rgba(74,222,128,.10);--accline:rgba(74,222,128,.35);
  --bad:#f87171;--badsoft:rgba(248,113,113,.09);--warn:#fbbf24;
  --h0:#1e2228;--h1:#0e4429;--h2:#006d32;--h3:#26a641;--h4:#39d353;
  --shadow:0 8px 30px rgba(0,0,0,.45)}
html.light{color-scheme:light;
  --bg:#fafaf8;--side:#f5f5f2;--panel:#ffffff;--hover:#f0f0ec;--line:#e6e4de;--line2:#d6d3cb;
  --text:#1c1d1f;--dim:#5c6068;--faint:#9a9da4;
  --acc:#15803d;--acc2:#16a34a;--accsoft:rgba(22,163,74,.09);--accline:rgba(22,163,74,.4);
  --bad:#dc2626;--badsoft:rgba(220,38,38,.07);--warn:#b45309;
  --h0:#ebedf0;--h1:#9be9a8;--h2:#40c463;--h3:#30a14e;--h4:#216e39;
  --shadow:0 8px 30px rgba(0,0,0,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:13px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-variant-ligatures:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
::selection{background:var(--accline)}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:2px;border-radius:3px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.acc{color:var(--acc)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:50px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.brand{font-weight:700;letter-spacing:-.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .cur{display:inline-block;width:8px;height:15px;background:var(--acc);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);padding:2px;gap:2px;background:var(--panel)}
.seg button{padding:4px 12px;border-radius:4px;color:var(--dim);white-space:nowrap;font-size:12px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--hover);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button .code{color:var(--faint);margin-left:6px;font-size:11px}
.seg button.on .code{color:var(--acc)}
.spacer{flex:1}
.save{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
.save.off i{background:var(--bad)}
.ibtn{height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line2);border-radius:var(--r);color:var(--dim);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;background:var(--panel)}
.ibtn:hover{color:var(--text);border-color:var(--faint)}
.save{cursor:pointer;padding:5px 9px;border-radius:20px;border:1px solid transparent}
.save:hover{border-color:var(--line2);color:var(--dim)}
.save.ok i{background:var(--acc)}.save.pending i,.save.syncing i{background:var(--warn);animation:pulse 1s infinite}.save.err i{background:var(--bad)}.save.local i{background:var(--faint)}
@keyframes pulse{50%{opacity:.3}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;backdrop-filter:blur(2px)}
html.light .ov{background:rgba(20,20,20,.28)}
.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow)}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhd h3::before{content:"$ ";color:var(--acc)}
.mbd{padding:6px 18px 18px}
.mbd section{padding:16px 0;border-bottom:1px solid var(--line)}
.mbd section:last-child{border-bottom:0}
.mbd .lbl2{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mbd p{margin:0 0 10px;font-size:12px;color:var(--dim);line-height:1.6}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fld span{font-size:11px;color:var(--dim)}
.fld input{height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);outline:none;font-size:12px}
.fld input:focus{border-color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin-bottom:12px}
.kv dt{color:var(--faint)}.kv dd{margin:0;word-break:break-all}
.code{font-size:15px;letter-spacing:1px;color:var(--acc);font-weight:600}
.err{color:var(--bad);font-size:11.5px;margin:6px 0 0}
details.setup{border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
details.setup summary{cursor:pointer;padding:9px 12px;font-size:12px;color:var(--dim);list-style:none}
details.setup summary::-webkit-details-marker{display:none}
details.setup summary::before{content:"▸ ";color:var(--acc)}
details.setup[open] summary::before{content:"▾ "}
details.setup ol{margin:0;padding:0 14px 6px 34px;font-size:12px;color:var(--dim);line-height:1.7}
details.setup ol li{margin-bottom:6px}
details.setup b{color:var(--text);font-weight:600}
pre.rules{margin:4px 14px 12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-size:11.5px;line-height:1.5;overflow-x:auto;position:relative}
.segs{display:flex;border:1px solid var(--line2);border-radius:var(--r);padding:2px;gap:2px;width:max-content}
.segs button{padding:4px 12px;border-radius:4px;font-size:12px;color:var(--dim)}
.segs button.on{background:var(--hover);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
@media (max-width:560px){.ibtn .tl{display:none}}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{border-right:1px solid var(--line);background:var(--side);position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.cmeta{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.cmeta .t{font-weight:650;font-size:13px;line-height:1.4}
.cmeta .s{font-size:11px;color:var(--dim);margin-top:2px}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
.cprog{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:12px 0 6px}
.cprog b{color:var(--acc);font-weight:600}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav .lbl{font-size:10px;letter-spacing:1.2px;color:var(--faint);padding:10px 10px 4px;text-transform:uppercase}
.nitem{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:5px;text-align:left;color:var(--dim);width:100%;position:relative}
.nitem:hover{background:var(--hover);color:var(--text)}
.nitem.on{background:var(--hover);color:var(--text)}
.nitem.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--acc);border-radius:2px}
.nitem .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nitem.on .n{color:var(--acc)}
.nitem .nt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .nc{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.nitem.full .nc{color:var(--acc)}
.nitem .nb{grid-column:2/4;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-2px}
.nitem .nb i{display:block;height:100%;background:var(--acc)}
.nitem .nb.z{opacity:.45}
.sfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.9}
.sfoot kbd,.kbd{font-family:var(--font);font-size:10px;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;color:var(--dim);background:var(--panel)}

/* main */
.main{min-width:0;padding:28px clamp(18px,3.2vw,44px) 60px;max-width:1240px;width:100%;margin:0 auto}
.mnav{display:none;margin-bottom:16px}
.mnav select{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.eyebrow{font-size:11px;color:var(--faint);letter-spacing:.4px}
.eyebrow b{color:var(--acc);font-weight:600}
h1{font-size:22px;letter-spacing:-.6px;margin:4px 0 4px;font-weight:700;line-height:1.3}
h2{font-size:19px;letter-spacing:-.5px;margin:4px 0 0;font-weight:650;line-height:1.35}
h3{font-size:13px;margin:0;font-weight:650}
.sub{color:var(--dim);font-size:12px}
.sub a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--faint)}
.sub a:hover{color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--r);font-size:12px;color:var(--text);background:var(--panel);text-decoration:none;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--faint);background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06120a;font-weight:600}
html.light .btn.pri{color:#fff}
.btn.pri:hover{filter:brightness(1.07);background:var(--acc)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.done{border-color:var(--accline);color:var(--acc);background:var(--accsoft)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-h h3::before{content:"## ";color:var(--faint);font-weight:400}

/* overview */
.ohead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;color:var(--faint)}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.8px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--faint);font-weight:500;letter-spacing:0}
.stat .bar{margin-top:10px}
.cont{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:14px;text-align:left;width:100%}
.cont:hover{border-color:var(--accline)}
.cont .pl{width:34px;height:34px;border-radius:50%;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:0 0 34px;font-size:12px}
.cont .ct{min-width:0;flex:1}
.cont .ct div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heatwrap{padding:16px 18px}
.heatscroll{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.heat{display:grid;grid-template-columns:28px repeat(53,11px);grid-template-rows:14px repeat(7,11px);gap:3px;width:max-content;font-size:9.5px;color:var(--faint)}
.heat .m{grid-row:1;white-space:nowrap;line-height:14px}
.heat .d{grid-column:1;line-height:11px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--h0);display:block}
.heat i[data-l="1"]{background:var(--h1)}.heat i[data-l="2"]{background:var(--h2)}.heat i[data-l="3"]{background:var(--h3)}.heat i[data-l="4"]{background:var(--h4)}
.heat i.today{outline:1px solid var(--dim);outline-offset:1px}
.heat i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--faint)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.heatfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--dim);gap:10px;flex-wrap:wrap}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wcard{padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:7px;transition:border-color .12s}
.wcard:hover{border-color:var(--line2);background:var(--hover)}
.wcard .wn{font-size:11px;color:var(--faint);display:flex;justify-content:space-between}
.wcard.full .wn span:last-child{color:var(--acc)}
.wcard .wt{font-size:12px;font-weight:600;line-height:1.4;min-height:34px}
.wcard .wm{font-size:10.5px;color:var(--faint);display:flex;gap:10px}
.wcard .wm .ok{color:var(--acc)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 16px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--dim);font-size:12px}
.links a:hover{color:var(--acc)}
.links a span:last-child{color:var(--faint)}

/* week */
.whead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto;scrollbar-width:none}
.tab{padding:9px 14px 10px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:12px;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}
.tab .tc{font-size:10px;color:var(--faint);padding:0 6px;border:1px solid var(--line2);border-radius:10px;line-height:16px}
.tab .tc.ok{color:var(--acc);border-color:var(--accline);background:var(--accsoft)}

.lec{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.frame{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative}
.frame iframe{width:100%;height:100%;border:0;display:block}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.ph::before{content:"";position:absolute;inset:0;background:rgba(5,7,9,.72)}
.ph .in{position:relative;text-align:center;color:#e9ecef;padding:20px;max-width:520px}
.ph .play{width:58px;height:58px;border-radius:50%;background:var(--acc);color:#06120a;display:inline-grid;place-items:center;font-size:20px;text-decoration:none;margin-bottom:12px;padding-left:4px}
.ph .play:hover{filter:brightness(1.1)}
.ph p{font-size:11.5px;color:#aab2bd;margin:6px 0}
.ph code{background:rgba(255,255,255,.08);padding:3px 7px;border-radius:4px;color:#e9ecef;font-family:var(--font);font-size:11.5px}
.ph .row{justify-content:center;margin-top:10px}
.ph .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#e9ecef}
.vmeta{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:11px;color:var(--faint);flex-wrap:wrap}
.vmeta b{color:var(--acc);font-weight:600}
.tag{font-size:10px;padding:0 6px;border:1px solid var(--line2);border-radius:3px;color:var(--dim);line-height:17px}
.vtitle{font-size:16px;font-weight:650;letter-spacing:-.3px;margin:4px 0 12px;line-height:1.4}
.list{overflow:hidden}
.list .lh{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
.li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 14px 10px 12px;border-bottom:1px solid var(--line);position:relative}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li.on{background:var(--accsoft)}
.li.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.chk{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;margin-top:2px;font-size:10px;color:transparent;transition:.12s}
.chk:hover{border-color:var(--acc)}
.chk.on{background:var(--acc);border-color:var(--acc);color:#06120a;font-weight:800}
html.light .chk.on{color:#fff}
.li .lt{text-align:left;font-size:12px;line-height:1.45;color:var(--text)}
.li .lt small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}
.li.dn .lt{color:var(--dim)}
.li .ld{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}

/* tests */
.thead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.note{font-size:11.5px;color:var(--dim);border-left:2px solid var(--line2);padding:2px 0 2px 10px;margin:12px 0 4px}
.qs{max-width:880px}
.q{padding:20px 0;border-bottom:1px solid var(--line)}
.q .qn{font-size:11px;color:var(--faint);margin-bottom:6px}
.q .qn b{color:var(--acc);font-weight:600}
.q .qp{font-size:13px;line-height:1.6;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:6px;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:12px;line-height:1.5;color:var(--dim);transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--faint);color:var(--text)}
.opt .lt{color:var(--faint)}
.opt.sel{border-color:var(--acc);color:var(--text);background:var(--accsoft)}
.opt.sel .lt{color:var(--acc)}
.opt.ok{border-color:var(--acc);color:var(--text);background:var(--accsoft)}
.opt.ok .lt{color:var(--acc)}
.opt.bad{border-color:var(--bad);color:var(--text);background:var(--badsoft)}
.opt.bad .lt{color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.6}
.why b.ok{color:var(--acc)}.why b.bad{color:var(--bad)}
.tbar{position:sticky;bottom:12px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);max-width:880px;flex-wrap:wrap}
.tbar .prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--dim);flex:1;min-width:180px}
.tbar .prog .bar{flex:1;max-width:220px}
.score{font-size:20px;font-weight:700;color:var(--acc);letter-spacing:-.5px}
.score.low{color:var(--warn)}
details.sol{margin-top:14px;max-width:880px}
details.sol summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:12px;color:var(--dim)}
details.sol summary::-webkit-details-marker{display:none}
details.sol summary::before{content:"▸";color:var(--acc);transition:transform .15s}
details.sol[open] summary::before{transform:rotate(90deg)}
details.sol .solbody{padding:0 14px 14px}

/* notes */
.ngrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.75fr);gap:20px;align-items:start}
.kd{margin:0}
.kd>div{padding:13px 0;border-bottom:1px solid var(--line)}
.kd>div:first-child{padding-top:2px}
.kd dt{font-size:12px;font-weight:650;color:var(--text)}
.kd dt::before{content:"› ";color:var(--acc)}
.kd dd{margin:4px 0 0 14px;font-size:12px;color:var(--dim);line-height:1.65}
.lab{padding:14px 16px;margin-top:18px;border-left:2px solid var(--acc)}
.lab .k{font-size:10.5px;color:var(--acc);letter-spacing:.5px;margin-bottom:4px}
.lab div:last-child{font-size:12px;line-height:1.6}
.res a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);text-decoration:none}
.res a:hover{color:var(--acc)}
.mine{position:sticky;top:70px}
.mine textarea{width:100%;min-height:340px;resize:vertical;border:0;border-top:1px solid var(--line);background:transparent;padding:14px 16px;font-size:12px;line-height:1.7;outline:none;color:var(--text);font-family:var(--font)}
.mine textarea::placeholder{color:var(--faint)}
.mine .mh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 16px;font-size:11px;color:var(--dim)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:7px;padding:9px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--acc);font-weight:600}

@media (max-width:1080px){.lec{grid-template-columns:1fr}.ngrid{grid-template-columns:1fr}.mine{position:static}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{display:none}.mnav{display:block}.top{gap:10px;padding:0 12px}.save{display:none}.seg button .code{display:none}}
@media (max-width:560px){.opts{grid-template-columns:1fr}.brand .bt{display:none}.main{padding:20px 14px 50px}h1{font-size:19px}}
@media (max-width:560px){.ph p,.ph .row{display:none}.ph .in::after{content:'tap ▶ to watch on YouTube';display:block;font-size:11px;color:#aab2bd}}
@media print{.top,.side,.tabs,.tbar,.mnav{display:none!important}.shell{display:block}}

const COURSES=[{"id":"rtl","code":"108106191","name":"VLSI Design Flow: RTL to GDS","short":"RTL → GDS","prof":"Prof. Sneh Saurabh","inst":"IIIT Delhi","intro":"AhiQeP002ZU","assignmentNote":"Original NPTEL questions are in the course PDF.","assignmentLink":["Original questions PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Assignments/Original%20Course%20Questions%20-%20Weeks%2001%20to%2012.pdf"],"links":[["NPTEL course page","https://nptel.ac.in/courses/108106191"],["Faculty page","https://sites.google.com/site/snehsaurabhhome/teaching/nptel-vlsi-design-flow-rtl-to-gds"],["GitHub notes repo","https://github.com/kapiltrip/RTL-to-GDS-Flow"],["Original assignments PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Assignments/Original%20Course%20Questions%20-%20Weeks%2001%20to%2012.pdf"],["Practice MCQs PDF (50/week)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Assignments/Practice%20MCQs%20-%2050%20per%20Week.pdf"],["Combined revision PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/Revision/Combined%20Revision.pdf"],["Browser practice (zip)","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/Assignments/Practice/Browser%20Practice%20-%20All%20Weeks.zip"],["Live session","https://www.youtube.com/watch?v=A5SUj2pK4eE"]],"weeks":[{"number":1,"title":"IC foundations & pre-RTL design","videos":[{"id":1,"title":"Basic Concepts of Integrated Circuit - I","youtube":"9QgdNsl9qwk","duration":"48:58","tutorial":false},{"id":2,"title":"Basic Concepts of Integrated Circuit - II","youtube":"6lJ2u7eYrek","duration":"37:47","tutorial":false},{"id":3,"title":"Overview of VLSI Design Flow - I","youtube":"vKtoQEAoGck","duration":"47:15","tutorial":false},{"id":4,"title":"Overview of VLSI Design Flow - II","youtube":"6_J-x1QfZs0","duration":"46:03","tutorial":false},{"id":5,"title":"Tutorial 1","youtube":"ztPFMRfpPfk","duration":"10:46","tutorial":true}],"notes":[["IC fundamentals","An integrated circuit combines devices and metal interconnect on one chip. Transistors occupy active layers; metal layers and vias connect them."],["Manufacturing","Lithography transfers mask patterns to wafers. A wafer contains many dies; wafer test, dicing and packaging follow fabrication."],["Design styles","Full-custom offers flexibility at high design effort; standard-cell ASICs use pre-characterized cells; FPGA fabrics are reconfigurable."],["Economic trade-offs","Total cost includes NRE (design, tools, masks) and per-unit manufacturing/packaging cost. Higher volume amortizes NRE."],["PPA","Power, Performance and Area are competing metrics. A faster design may use larger cells or more buffers and consume more power."],["Levels of abstraction","System/algorithm → architecture → RTL → gates → physical geometry. Refinement adds implementation detail."],["Pre-RTL decisions","Hardware/software partitioning, IP reuse, SoC architecture and high-level synthesis precede implementation of RTL."],["Unix tutorial","Practice pwd, ls, cd, mkdir, cat, grep, find, and output redirection. EDA tools often run from Linux shells."]],"lab":"Create a clean Linux project folder, identify active layers in a CMOS cross-section, and compare ASIC vs FPGA PPA/NRE in a table.","assignment":[{"q":"A fab plans to manufacture only 20 experimental ASICs. Which expense is hardest to amortize over that run?","options":["A unit test probe operation","A single wafer's silicon","Mask and design NRE","Per-die packaging cost"],"answer":2,"why":"Non-recurring design and mask costs are shared across the production quantity."},{"q":"A chip team chooses an FPGA prototype before tape-out. Which property helps most?","options":["Its wires have zero parasitic resistance","It can be reprogrammed after manufacture","Its gates are fabricated specifically for the RTL","Its mask set is free for all future ASICs"],"answer":1,"why":"FPGA configuration lets the team modify logic without another wafer run."},{"q":"Two routes on an IC cross without electrical connection. Which structure makes the isolation possible?","options":["Separate metal layers without a connecting via","A single shared diffusion region","A via connecting the two layers","A shorted contact cut"],"answer":0,"why":"Interconnect layers can cross and stay separate when no via connects them."},{"q":"Which activity belongs to design rather than wafer fabrication?","options":["Depositing dielectric films","Selecting pipeline depth and register boundaries","Etching an interconnect layer","Growing oxide on silicon"],"answer":1,"why":"Architectural pipelining decisions are part of circuit design."},{"q":"An ASIC cell library is ported to a different process node. Why is remapping necessary?","options":["RTL cannot describe sequential logic anymore","The clock becomes analog-only","The Boolean truth tables must all change","Cell geometry, timing and power depend on the process"],"answer":3,"why":"Each technology offers distinct device characteristics and characterized cells."},{"q":"Which statement best captures the power–performance–area trade-off?","options":["A smaller layout always has fewer delay violations","Upsizing a gate may improve delay while increasing area and capacitance","Any faster design always consumes less power","Area is determined only by Verilog source length"],"answer":1,"why":"Stronger drive typically increases input capacitance and silicon area."},{"q":"Which output is produced by behavioral synthesis / HLS?","options":["An RTL implementation derived from higher-level behavior","A final packaged chip","A fabricated wafer","A mask rule manual"],"answer":0,"why":"HLS schedules and binds operations into a hardware structure."},{"q":"An IP block is integrated into a SoC. Which must be specified before RTL-level integration works reliably?","options":["Package color","Wafer carrier serial number","Interface protocol, clocking and reset expectations","The exact filename of every synthesis log"],"answer":2,"why":"Interoperability depends on interface and timing contracts."},{"q":"What does a PDK usually contain for implementation and physical checking?","options":["A list of programming languages used by the fab","A direct replacement for the entire RTL design","Technology design rules, devices and process-related data","A finished application testbench only"],"answer":2,"why":"A PDK communicates foundry-specific technology data and rules."},{"q":"To list the contents of a Linux project directory without changing it, use which command?","options":["cd","mkdir","rm","ls"],"answer":3,"why":"ls displays directory entries without editing them."}],"quiz":[{"q":"What makes a monolithic integrated circuit different from a PCB of discrete transistors?","options":["It always uses an FPGA","It needs no testing","Devices are formed together on one substrate","It contains no wires"],"answer":2,"why":"Monolithic integration fabricates connected structures within one chip rather than separately packaging all devices."},{"q":"Which component connects conductors on two adjacent metal layers?","options":["Via","Photoresist","Bonding wire outside die","Silicon dioxide bulk"],"answer":0,"why":"A via provides a vertical electrical connection between interconnect layers."},{"q":"Photolithography is primarily used to do what?","options":["Transfer a pattern to a wafer","Compile Tcl scripts","Run static timing analysis","Generate ATPG vectors"],"answer":0,"why":"Lithography uses light, masks and resist to pattern fabrication layers."},{"q":"What is generally classified as non-recurring engineering (NRE) cost?","options":["Electricity consumed by each shipped chip","Package cost per chip","Mask development and initial design effort","Wafer cost per chip"],"answer":2,"why":"NRE is paid up front and amortized over production volume."},{"q":"Which implementation style normally offers reconfigurable hardware after manufacture?","options":["Gate array mask set","FPGA","Fixed-cell standard ASIC","Full-custom mask ROM"],"answer":1,"why":"An FPGA has programmable routing/logic resources."},{"q":"What does PPA stand for in ASIC design?","options":["Power, Pins, Accuracy","Process, Packaging, Assembly","Placement, Parasitics, Alignment","Power, Performance, Area"],"answer":3,"why":"PPA summarizes three core implementation trade-offs."},{"q":"Which abstraction normally comes immediately before detailed logic synthesis?","options":["GDS geometry","Final packaged die","RTL","Mask fracture"],"answer":2,"why":"RTL describes register transfers and combinational functions before gate mapping."},{"q":"Which is an example of pre-RTL architecture work?","options":["GDS DRC","Hardware/software partitioning","Clock-tree buffering","Detailed routing"],"answer":1,"why":"System partitioning determines which functions become hardware or software."},{"q":"What does a process design kit (PDK) primarily provide?","options":["Only RTL source files","Only Python libraries","Technology rules, device models and design collateral","Only application binaries"],"answer":2,"why":"PDKs enable designers to target a specific foundry process."},{"q":"What does the shell command pwd print?","options":["Running processes","Contents of a file","Disk partitions","Current working directory"],"answer":3,"why":"pwd expands to print working directory."}],"resources":[["Day 01 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2001%20-%20IC%20Foundations%20and%20Logic%20Synthesis.pdf"],["Day 01 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2001.md"],["Week 01 revision PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/Revision/Week%2001%20-%20Revision.pdf"]]},{"number":2,"title":"RTL-to-GDS stages & Tcl","videos":[{"id":6,"title":"Overview of VLSI Design Flow - III","youtube":"3uujV3nJvNM","duration":"43:01","tutorial":false},{"id":7,"title":"Overview of VLSI Design Flow - IV","youtube":"--wJOkCvn2M","duration":"54:43","tutorial":false},{"id":8,"title":"Overview of VLSI Design Flow - V","youtube":"g6ElOGlF3bs","duration":"59:17","tutorial":false},{"id":9,"title":"Overview of VLSI Design Flow - VI","youtube":"BdIkRSzgV5I","duration":"28:43","tutorial":false},{"id":10,"title":"Introduction to TCL","youtube":"1fPNZstiL4o","duration":"10:38","tutorial":true}],"notes":[["RTL-to-GDS pipeline","RTL elaboration → logic synthesis → technology mapping → floorplan → placement → CTS → routing → signoff → GDS."],["Synthesis","Maps a synthesizable HDL description to a technology-independent or standard-cell gate network under constraints."],["Physical design","Places mapped instances, constructs clock networks and routes signals/power while meeting density and design-rule requirements."],["Verification versus test","Functional verification checks the design intent; manufacturing test detects defects in fabricated chips."],["Post-GDS","DRC/LVS, parasitic extraction, timing closure and tape-out checks precede mask generation and fabrication."],["Tcl","Tcl uses set for variables, $ for substitution, [command] for command evaluation and braces to control substitution."],["Tcl example","set clk_period 10.0; puts \"Period = $clk_period\". Tcl often scripts timing and synthesis tools."]],"lab":"Write a small Tcl script that defines variables, loops over a list, prints results, and relates tool stages to generated netlist/DEF/GDS artifacts.","assignment":[{"q":"A synthesized netlist meets logic function requirements but placement has not begun. Which task comes next in the typical physical flow?","options":["Post-silicon wafer sort","Floorplanning and placement preparation","Final metal mask generation","Packaging and board assembly"],"answer":1,"why":"Physical design begins with floorplan, power and placement planning."},{"q":"The floorplan is complete, but routed nets do not exist. Which step actually assigns cells to legal sites?","options":["DRC signoff","ATPG","High-level synthesis","Placement"],"answer":3,"why":"Placement determines the physical locations of standard cells."},{"q":"A chip shows severe clock arrival variation after placing registers. Which flow step explicitly builds the distribution tree?","options":["Clock tree synthesis","Firmware compilation","Wafer dicing","C-to-RTL translation"],"answer":0,"why":"CTS creates and balances the clock delivery network."},{"q":"A layout has correct circuit connectivity but violates minimum spacing. Which check should catch it?","options":["DRC","SAT equivalence","LVS","RTL lint only"],"answer":0,"why":"Design rule checking verifies geometric manufacturing constraints."},{"q":"A layout passes DRC but one signal wire is connected to the wrong gate pin. Which check is relevant?","options":["LVS","Wafer probe","Floorplan aspect ratio calculation","Clock gating"],"answer":0,"why":"Layout versus schematic checks extracted connectivity against the target netlist."},{"q":"Why does timing closure often require iteration after routing?","options":["Clock periods are chosen only after packaging","Cell logic functions become undefined","Routing removes all cell delays","Interconnect resistance and capacitance change path delay"],"answer":3,"why":"Actual wires add delay not known accurately at synthesis."},{"q":"In Tcl, what happens in set t [expr {4 * 2}]?","options":["A Verilog always block is inferred","The variable t receives 8","The variable t receives the literal characters [expr...]","The shell exits immediately"],"answer":1,"why":"Square brackets run a command and substitute its result."},{"q":"In Tcl, which syntax best preserves literal braces without evaluating $name?","options":["set msg {$name}","set msg \"$name\"","expr $name + 1","puts $name"],"answer":0,"why":"Braces prevent usual variable and command substitution while parsing Tcl arguments."},{"q":"A verification engineer exercises RTL against expected outputs. Which defect class can this reveal before fabrication?","options":["Random bonding damage","Dust particle yield faults on a future wafer","Individual transistor process defects only","Functional design errors"],"answer":3,"why":"Simulation validates behavior, not the physical quality of future chips."},{"q":"Which representation is normally handed to tape-out manufacturing after signoff?","options":["GDSII/OASIS layout geometry","A unit-test coverage HTML","Unelaborated Verilog alone","A Tcl variable table"],"answer":0,"why":"Mask data includes actual geometries for fabrication."}],"quiz":[{"q":"What is the correct general order of implementation stages?","options":["GDS → RTL → CTS → synthesis","RTL → routing → synthesis → placement","Placement → RTL → synthesis → mapping","RTL → synthesis → placement → routing"],"answer":3,"why":"The netlist must be synthesized before standard cells can be placed and routed."},{"q":"What is a standard-cell netlist?","options":["Connectivity among library cell instances","A list of PCB packages","A transistor mask polygon list","Only a waveform recording"],"answer":0,"why":"The mapped gate-level design contains standard-cell instances and connections."},{"q":"Which stage creates a clock distribution network?","options":["Clock tree synthesis (CTS)","RTL parsing","Wafer dicing","ATPG"],"answer":0,"why":"CTS inserts/balances buffers and routes for the clock sinks."},{"q":"Which analysis checks whether layout geometry obeys process spacing/width rules?","options":["Simulation","Fault coverage","DRC","RTL lint"],"answer":2,"why":"Design Rule Checking targets physical geometry constraints."},{"q":"Which analysis verifies that extracted layout connectivity agrees with the intended circuit?","options":["LVS","Power simulation","Clock period generation","Coverage collection"],"answer":0,"why":"Layout Versus Schematic compares circuit connectivity."},{"q":"When is manufacturing testing typically performed?","options":["Before any transistor exists","Only during RTL elaboration","Only while compiling Tcl","On fabricated dies or packaged chips"],"answer":3,"why":"Manufacturing test seeks defects on real produced hardware."},{"q":"In Tcl, which command assigns a value to a variable?","options":["assign","const","set","let"],"answer":2,"why":"Tcl uses set name value."},{"q":"In Tcl, what does $period perform?","options":["Comment out a line","Run an operating-system process","Declare a module","Variable substitution"],"answer":3,"why":"The dollar sign expands the current value of a variable."},{"q":"In Tcl, what does [expr {2+3}] do?","options":["Create a clock named expr","Perform metal routing","Evaluate a nested command returning 5","Declare an array of five registers"],"answer":2,"why":"Square brackets evaluate commands; expr calculates an arithmetic expression."},{"q":"Which file typically stores finalized physical mask geometry?","options":["Liberty .lib","SDC","GDSII","VCD"],"answer":2,"why":"GDSII stores hierarchical geometry for manufacturing handoff."}],"resources":[["Day 01 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2001%20-%20IC%20Foundations%20and%20Logic%20Synthesis.pdf"],["Day 01 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2001.md"],["Day 02 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2002%20-%20Physical%20Design%20and%20Verilog%20Foundations.pdf"],["Day 02 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2002.md"],["Week 02 revision PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/Revision/Week%2002%20-%20Revision.pdf"]]},{"number":3,"title":"Verilog, simulation & HLS","videos":[{"id":11,"title":"Hardware Modeling: Introduction to Verilog - I","youtube":"LOIqVrr9jGE","duration":"46:11","tutorial":false},{"id":12,"title":"Hardware Modeling: Introduction to Verilog - II","youtube":"XEtpwZDhdTk","duration":"48:27","tutorial":false},{"id":13,"title":"Functional Verification using Simulation","youtube":"3EmADY-fSaw","duration":"64:57","tutorial":false},{"id":14,"title":"High-level synthesis using Bambu - Tutorial 3","youtube":"Ubupdoq8Nio","duration":"07:14","tutorial":true}],"notes":[["Verilog modules","module ... endmodule defines hierarchy and ports. Wires model nets; logic/reg variables can be assigned procedurally."],["Combinational logic","Use assign or always @(*) / always_comb, cover all output paths, and use blocking = for procedural combinational code."],["Sequential logic","Use always @(posedge clk) or always_ff and nonblocking <= for registers; choose reset semantics deliberately."],["Simulation","An event-driven simulator schedules signal updates across event regions and advances time only when necessary."],["Testbench","Drive stimulus, model expected behavior and assert outcomes; a testbench is not usually synthesized."],["Coverage","Statement/branch/toggle coverage indicate what ran; functional coverage indicates which desired scenarios were exercised."],["High-level synthesis","Bambu can compile suitable higher-level descriptions into RTL; latency, throughput and resources depend on scheduling/binding."]],"lab":"Write a parameterized 8-bit up/down counter and a self-checking Verilog testbench; collect a VCD and inspect it in GTKWave.","assignment":[{"q":"A counter uses a clocked always block with blocking assignments to related registers. What coding change is generally advisable?","options":["Use delays on every assignment","Delete the state registers","Use nonblocking assignments for sequential register updates","Replace the clock with a combinational signal"],"answer":2,"why":"Nonblocking updates avoid ordering-dependent modeling issues in clocked logic."},{"q":"An if statement in an always_comb process omits the else branch for y. What is the chief synthesis risk?","options":["Synthesis silently removes the output","Automatic zero assignment","A guaranteed flop triggered by posedge clk","Inferred latch holding the previous value"],"answer":3,"why":"Incomplete combinational assignments can require retaining previous state."},{"q":"A testbench drives data 2 ns before the active clock edge. Is that 2 ns delay normally a physical gate in the synthesized DUT?","options":["No, the testbench delay controls simulation stimulus","Only if the simulation has a VCD","Yes, it becomes a PLL","Yes, all testbench delays become inverter chains"],"answer":0,"why":"Testbenches are generally not synthesized with the design."},{"q":"A Verilog parameter changes from 8 to 16. What can change during elaboration?","options":["Declared bus widths and generated hardware structure","Only the waveform filename","The source code must be rewritten in C","The lithography wavelength"],"answer":0,"why":"Parameters specialize the RTL instance before synthesis."},{"q":"A designer wants a waveform from Icarus simulation. Which file type is commonly produced?","options":["LEF","GDSII","VCD","Liberty"],"answer":2,"why":"Value Change Dump files record signal transitions for viewing."},{"q":"Which testbench strategy detects wrong outputs automatically?","options":["Replace inputs with physical pins","Only open a waveform and assume it is correct","Remove the clock from all sequential tests","Use a reference model and assertions/checkers"],"answer":3,"why":"Checkers compare observed DUT behavior with expectations."},{"q":"A statement line has been executed at least once. Does that prove all functional corner cases were tested?","options":["Yes, timing closure follows automatically","No, code coverage alone cannot guarantee functional coverage","Yes, every possible input has been tested","No, simulation cannot evaluate conditionals"],"answer":1,"why":"Code coverage and functional coverage measure different things."},{"q":"In Verilog, what does assign z = a & b; describe?","options":["Continuous combinational logic","A probe tied to ground","A software loop executed on a CPU","A positive-edge D flip-flop"],"answer":0,"why":"Continuous assignments drive nets as their inputs change."},{"q":"What is a meaningful HLS scheduling trade-off?","options":["HLS must always produce one cycle per function","Operation scheduling does not affect hardware","Fewer shared operators may reduce area but increase latency","Fewer operators always improve throughput"],"answer":2,"why":"Resource sharing and parallelism trade latency, throughput and area."},{"q":"What is the role of the Bambu tutorial in this course?","options":["Generate GDS directly from a text editor","Demonstrate high-level synthesis to RTL","Perform final LVS on chip photographs","Compile layout rules into Verilog"],"answer":1,"why":"Bambu synthesizes eligible high-level input descriptions into hardware."}],"quiz":[{"q":"What does an always @(posedge clk) block usually model in Verilog?","options":["A continuous-time amplifier","An analog resistor","Edge-triggered sequential behavior","Physical routing"],"answer":2,"why":"A positive-edge event corresponds to behavior driven by clock transitions."},{"q":"Which assignment operator is preferred for ordinary clocked register updates?","options":["Case equality ===","Blocking = only","Nonblocking <=","Bitwise &"],"answer":2,"why":"Nonblocking assignments avoid many order-dependent simulation races in sequential RTL."},{"q":"What is a typical purpose of a Verilog testbench?","options":["Replace the clock network","Describe metal via rules","Generate foundry masks directly","Apply stimulus and check expected responses"],"answer":3,"why":"Testbenches exercise and check the design under test."},{"q":"What often causes an unintended latch in a combinational always block?","options":["Using a continuous assign","Not assigning an output on all control paths","Using a constant input","Including a module name"],"answer":1,"why":"Incomplete combinational assignments preserve old values, requiring storage."},{"q":"A VCD file usually contains what?","options":["Standard-cell physical dimensions","Signal changes over simulation time","A GDS die outline","ATPG scan-cell placement"],"answer":1,"why":"Value Change Dump files store waveform activity."},{"q":"Which tool is a Verilog simulation tool?","options":["Magic DRC only","OpenROAD detailed router","Icarus Verilog","KLayout layout viewer only"],"answer":2,"why":"Icarus compiles and runs Verilog simulations."},{"q":"Which statement about simulation coverage is accurate?","options":["100% statement coverage proves no bugs","High coverage does not prove correctness","Coverage is irrelevant to testbenches","Coverage always equals path count"],"answer":1,"why":"Coverage indicates what was exercised, not correctness of all possible behaviors."},{"q":"In Verilog, what does parameter usually allow?","options":["Module-time configuration and elaboration","GDS mask compression","Runtime chip temperature change","Clock jitter measurement"],"answer":0,"why":"Parameters customize widths and structures when elaborated."},{"q":"What is a key purpose of high-level synthesis (HLS)?","options":["Convert GDS to Verilog testbenches only","Generate metal mask rectangles from SEM","Transform suitable algorithmic code into RTL","Perform package pin bonding"],"answer":2,"why":"HLS schedules operations and allocates hardware to implement a high-level description."},{"q":"Which tool is demonstrated for HLS in this course?","options":["Icarus waveform viewer","GTKWave","Bambu","OpenSTA"],"answer":2,"why":"The Week 3 tutorial uses Bambu."}],"resources":[["Day 02 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2002%20-%20Physical%20Design%20and%20Verilog%20Foundations.pdf"],["Day 02 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2002.md"],["Day 03 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2003%20-%20Simulation%20Synthesis%20and%20Logic%20Optimization.pdf"],["Day 03 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2003.md"],["Week 03 revision PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/Revision/Week%2003%20-%20Revision.pdf"]]},{"number":4,"title":"RTL synthesis & logic minimization","videos":[{"id":15,"title":"RTL Synthesis - Part I","youtube":"cnpWgZLgB4I","duration":"55:10","tutorial":false},{"id":16,"title":"RTL Synthesis - Part II","youtube":"7BEKV6FRrOg","duration":"35:02","tutorial":false},{"id":17,"title":"Logic Optimization - Part I","youtube":"xL6VvlsKrjk","duration":"70:51","tutorial":false},{"id":18,"title":"Simulation-based Verification using Icarus","youtube":"9Wzz--APeLU","duration":"15:40","tutorial":true}],"notes":[["Elaboration","Parameters, generate blocks and hierarchy are resolved into a concrete design before optimization."],["Synthesizable constructs","Combinational logic, registers and constant-bounded structures can map to hardware; many file-I/O and delay constructs are simulation-only."],["Latch inference","An incomplete assignment in a combinational process may infer storage. Provide defaults or complete coverage."],["Two-level optimization","Sum-of-products and product-of-sums express Boolean logic with two gate levels (ignoring input inversions)."],["Karnaugh/Quine-McCluskey","Logic minimization identifies implicants and covers minterms, respecting don't-care conditions."],["Technology effects","Fewest literals does not always mean best silicon timing, power or area after cell mapping."],["Icarus tutorial","Compile a testbench using iverilog -g2012 -o sim.out design.v tb.v, run vvp sim.out, inspect waveforms with GTKWave."]],"lab":"Run Icarus Verilog on a combinational/sequential module, deliberately create and fix an inferred latch, then view synthesis differences.","assignment":[{"q":"An RTL process sets out=1 only for one condition and never assigns it otherwise. Which synthesis object is likely unintended?","options":["Level-sensitive latch","A guaranteed synchronous reset","A harmless constant 1","A metal via"],"answer":0,"why":"The output must retain its prior value when the condition is false."},{"q":"A 4-bit mux has no default case for 2 unsupported select encodings. What is a robust combinational coding approach?","options":["Set a default output before the case statement","Add #5 to each case arm","Remove the always block","Declare the output as a clock"],"answer":0,"why":"A default assignment avoids accidental state retention."},{"q":"A synthesis report shows 400 multiplexers after elaboration. What was one likely source?","options":["Physical metal density fill","The testbench waveform dump","Package pinout naming","Conditional and case-based RTL data selection"],"answer":3,"why":"Selection logic in RTL often maps to mux networks."},{"q":"The expression F=AB+AC can be factored to which equivalent form?","options":["A+B+C","(A+B)(A+C)","A(B+C)","ABC"],"answer":2,"why":"Distributivity: AB+AC=A(B+C)."},{"q":"For a Boolean expression, don't-care minterms may be selected as which value?","options":["Always 0, regardless of the design","Always 1, regardless of design","A third physical voltage guaranteed by CMOS","Whichever 0 or 1 improves the chosen implementation"],"answer":3,"why":"Don't-care combinations are unconstrained in the specified function."},{"q":"If a K-map group is made larger while respecting valid minterms, what typically happens?","options":["The truth table gains new required outputs","The corresponding product term uses fewer literals","It always requires more flip-flops","It generates more RTL ports"],"answer":1,"why":"A larger implicant eliminates more input variables."},{"q":"Why is literal count not an adequate standalone timing metric?","options":["Literal count already includes all post-route RC","Library cell arcs, fanout and wires also affect delay","Clock period is unrelated to delay","Area must increase with every simplification"],"answer":1,"why":"Physical delay depends on electrical loading and cell choices."},{"q":"Which command invokes a compiled Icarus executable named sim.out?","options":["yosys sim.out","make gds sim.out","iverilog sim.out","vvp sim.out"],"answer":3,"why":"The vvp runtime executes Icarus simulation output."},{"q":"Which synthesis stage converts generic logic to target standard-cell instances?","options":["Testbench elaboration","Wafer probe","Technology mapping","Detailed routing"],"answer":2,"why":"Technology mapping selects concrete cells from the technology library."},{"q":"How should an RTL optimization be checked for correctness?","options":["Run DRC on RTL text","Check only file size","Compare outputs against the reference using simulation or equivalence","Assume smaller netlist proves correctness"],"answer":2,"why":"Optimization must preserve the intended function."}],"quiz":[{"q":"What occurs during elaboration?","options":["Metal wires are physically routed","Parameter values and generate structures are resolved","JTAG patterns are applied to a packaged chip","The die is cut from the wafer"],"answer":1,"why":"Elaboration turns RTL hierarchy into a concrete design model."},{"q":"Which Verilog construct is generally not suitable as synthesizable RTL hardware timing?","options":["A bounded combinational case","A continuous assign","#10 delay in ordinary RTL","A flip-flop always block"],"answer":2,"why":"Simulation delays do not directly map to gate hardware delays in ordinary synthesis."},{"q":"A complete combinational case statement should do what?","options":["Always use nonblocking assignments","Explicitly instantiate metal vias","Assign every output on all paths","Avoid defaults in all circumstances"],"answer":2,"why":"Complete assignments prevent unintended latches."},{"q":"What does a sum-of-products form represent?","options":["AND of OR terms only","A clock tree","Placement density map","OR of AND terms"],"answer":3,"why":"SOP combines product (AND) terms using OR."},{"q":"Why are don't-care inputs useful in Boolean minimization?","options":["They force each output to high impedance","They must be tested as both 0 and 1 in silicon","They determine wafer thickness","They permit alternate values that simplify logic"],"answer":3,"why":"Unspecified cases can enlarge implicants and reduce logic."},{"q":"What is a prime implicant?","options":["Any input register","An implicant that cannot be expanded without covering a required zero","A physically oversized cell","A clock gating latch"],"answer":1,"why":"Prime implicants are maximal legal cubes in logic minimization."},{"q":"Which factor can make a logically minimal expression slower after implementation?","options":["Fewer alphabetic letters in signal names","High fanout and real cell delays","Shorter Verilog file name","More comments"],"answer":1,"why":"Physical delay depends on cell and interconnect, not just Boolean literal count."},{"q":"Which command compiles Verilog with Icarus?","options":["iverilog","openroad -version","vvp","git init"],"answer":0,"why":"iverilog produces a simulation executable; vvp runs it."},{"q":"Which command runs a compiled Icarus Verilog simulation?","options":["vvp","gdsii","read_lef","yosys -lvs"],"answer":0,"why":"The vvp runtime executes Icarus output."},{"q":"What normally happens after the RTL process is translated into registers and muxes?","options":["Immediate wafer dicing","Final metal CMP before synthesis","Package molding","Optimization and technology mapping"],"answer":3,"why":"Mapped logic is optimized before physical implementation."}],"resources":[["Day 03 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2003%20-%20Simulation%20Synthesis%20and%20Logic%20Optimization.pdf"],["Day 03 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2003.md"]]},{"number":5,"title":"Multilevel optimization & formal basics","videos":[{"id":19,"title":"Logic Optimization - Part II","youtube":"x747bipwDeQ","duration":"69:46","tutorial":false},{"id":20,"title":"Logic Optimization - Part III","youtube":"HNqmpCD2-pY","duration":"33:48","tutorial":false},{"id":21,"title":"Formal Verification - I","youtube":"Li-tGyilPOc","duration":"67:15","tutorial":false},{"id":22,"title":"Logic Synthesis using Yosys","youtube":"c-cFxuH-HbE","duration":"07:34","tutorial":true}],"notes":[["Multilevel logic","Factor common subexpressions into shared internal nodes. Algebraic factoring can reduce gates versus flat two-level covers."],["Sharing trade-offs","A shared node can reduce area but high fanout increases wire/load delay and may require buffers."],["FSM optimization","State minimization and encoding (binary, one-hot, Gray) trade flop count, decode depth, power and timing."],["Formal verification","Proves or disproves properties mathematically over a model, rather than testing only selected simulated inputs."],["BDD","Binary decision diagrams canonically represent Boolean functions for a fixed variable order; representation size depends strongly on ordering."],["SAT","A SAT solver decides whether a Boolean formula has a satisfying assignment; UNSAT can establish certain equivalence properties."],["Yosys tutorial","A common chain: read_verilog; hierarchy -top TOP; proc; opt; fsm; techmap; opt; stat; write_verilog."]],"lab":"Synthesize two equivalent Boolean implementations with Yosys and compare the cell statistics, logic depth and fanout.","assignment":[{"q":"A term is shared by 80 logic cones. Which physical drawback may offset gate-count savings?","options":["A smaller clock uncertainty by definition","High fanout loading and buffering","Automatic removal of all logic depth","Elimination of all placement congestion"],"answer":1,"why":"Sharing can increase fanout and routed load."},{"q":"A 10-state controller chooses one-hot encoding. Approximately how many state flops are needed?","options":["2","10","4","100"],"answer":1,"why":"One-hot typically dedicates one register bit per encoded state."},{"q":"For an 11-state FSM, what is the theoretical minimum binary state bit count?","options":["11","3","8","4"],"answer":3,"why":"Ceiling(log2(11)) is four bits."},{"q":"When using symbolic formal methods, what can cause a BDD to grow dramatically?","options":["Giving it a shorter filename","Disabling waveform dumping","Using lowercase signal names","Poor variable ordering"],"answer":3,"why":"BDD size is highly sensitive to variable order."},{"q":"What does a satisfying assignment from a SAT-based miter suggest?","options":["There is an input pattern that makes compared outputs differ","The FPGA LUT size is fixed","The designs are formally equivalent","All state machines are minimal"],"answer":0,"why":"A satisfying miter identifies a mismatch witness."},{"q":"Which situation demonstrates the value of formal checking over random simulation?","options":["The design has no inputs","Random tests already cover all state space by definition","The chip has been manufactured","An input corner case is extremely rare"],"answer":3,"why":"Formal techniques can reason about corner cases without relying on random hits."},{"q":"When replacing a logic cone with a simplified network, what must remain equivalent?","options":["The count of RTL lines","The exact cell placement coordinates","The specified observable outputs for legal inputs","The source variable names"],"answer":2,"why":"Internal structure may change as long as externally specified behavior is preserved."},{"q":"A binary-encoded FSM and a one-hot FSM implement identical transitions. Is equal flop count required for equivalence?","options":["No, internal representations can differ","Yes, flop count fixes functionality","Only if the clock is removed","Yes, all equivalent FSMs share encoding"],"answer":0,"why":"Equivalence concerns behavior rather than identical encodings."},{"q":"After running Yosys synth, which result best indicates whether sequential and combinational elements exist?","options":["A GDS tape-out receipt","A package bill of materials","A cell/statistics report","A wafer yield map"],"answer":2,"why":"Synthesis reports enumerate inferred and mapped logic objects."},{"q":"Which assertion is suitable for proving that a request is always acknowledged within 3 cycles?","options":["Only a DRC spacing check","A power grid IR-drop rule","A bounded temporal response property","A package pin assignment"],"answer":2,"why":"Formal properties can express timing relationships between signals."}],"quiz":[{"q":"What does multilevel logic optimization commonly do?","options":["Remove every register","Create photomasks directly","Only change the module filename","Factor and share intermediate expressions"],"answer":3,"why":"Multilevel factoring can reduce duplicated gates by sharing subfunctions."},{"q":"What is a downside of excessive sharing of a logic node?","options":["Lower chip pin count always","Automatic formal proof failure","Guarantee of minimum path delay","Large fanout and buffer requirements"],"answer":3,"why":"High fanout raises load and can hurt timing."},{"q":"Which FSM encoding typically uses roughly one state bit per state?","options":["BCD of transistor count","Binary","One-hot","Gray with one bit always"],"answer":2,"why":"One-hot state encoding dedicates a flip-flop for each state."},{"q":"How many bits can binary encoding represent at most with 3 bits?","options":["3 states","8 states","16 states","6 states"],"answer":1,"why":"2^3 = 8 distinct bit patterns."},{"q":"Formal verification differs from typical simulation because it can do what?","options":["Guarantee fabricated silicon has no manufacturing defects","Measure real wire capacitance","Eliminate the need for any specifications","Reason about all modeled states/inputs under assumptions"],"answer":3,"why":"Formal methods prove or refute properties within a mathematical model."},{"q":"What does SAT ask?","options":["Whether a die fits a package","Whether a Boolean formula has a satisfying assignment","Whether clock skew is physically zero","Whether the router can use two layers"],"answer":1,"why":"SAT is Boolean satisfiability."},{"q":"Which structural choice strongly impacts BDD memory usage?","options":["Verilog comment order","Tcl prompt color","Variable ordering","GDS layer names"],"answer":2,"why":"BDD size can change dramatically with the variable order."},{"q":"What is a counterexample from a formal tool?","options":["A passed DRC report","An FPGA bitstream","A new Liberty cell","An input/state trace violating a property"],"answer":3,"why":"A failing property is typically accompanied by witness behavior."},{"q":"Which tool is used in the Week 5 synthesis tutorial?","options":["Yosys","MATLAB Simulink only","SPICE only","Cadence Virtuoso only"],"answer":0,"why":"The course demonstrates logic synthesis using Yosys."},{"q":"What is an appropriate synthesis quality check?","options":["Inspect cell counts and timing after mapping","Count the number of spaces in the RTL","Compare filenames alphabetically","Only count lines of comments"],"answer":0,"why":"Area/timing/structure reports reveal the result of synthesis."}],"resources":[["Day 04 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2004%20-%20Multilevel%20Optimization%20and%20Formal%20Verification.pdf"],["Day 04 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2004.md"]]},{"number":6,"title":"Formal methods & technology libraries","videos":[{"id":23,"title":"Formal Verification - II","youtube":"wN6XP-aTlRs","duration":"34:22","tutorial":false},{"id":24,"title":"Formal Verification - III","youtube":"u494ozFC5pI","duration":"64:02","tutorial":false},{"id":25,"title":"Formal Verification - IV","youtube":"uQ-xAc7SxEc","duration":"39:54","tutorial":false},{"id":26,"title":"Technology Library","youtube":"tcfwuloB-zM","duration":"62:32","tutorial":false},{"id":27,"title":"Logic Optimization using Yosys","youtube":"Phcq_iDo3ss","duration":"14:46","tutorial":true}],"notes":[["Model checking","Checks temporal properties against a state-transition system; a violation may produce a counterexample trace."],["Equivalence checking","A miter compares outputs of reference and implementation with shared inputs; prove the output XOR is always zero."],["Sequential equivalence","Must account for clocks, reset, initial states and state mappings; it is more nuanced than combinational comparison."],["Library cells","A Liberty .lib file describes cell functions, area, pin capacitance, timing arcs and power tables."],["Cell timing","Propagation delay and transition depend on input slew and output load (and process/voltage/temperature)."],["Setup/hold","Sequential cell setup and hold constraints bound data changes around an active clock edge."],["Yosys demo","Optimization passes simplify logic and structure; always inspect mapping, area and equivalence afterward."]],"lab":"Build a simple equivalence miter for two small combinational modules and inspect a Liberty timing arc (pin load, cell delay).","assignment":[{"q":"Two purely combinational designs are compared. Their XOR-miter output is proven never high. What follows under the proof assumptions?","options":["They are functionally equivalent for the modeled inputs","They cannot have hold violations","They use identical transistor sizes","They have identical placement"],"answer":0,"why":"A zero mismatch output establishes the compared Boolean equivalence."},{"q":"A sequential equivalence proof fails only after reset. What additional aspect should be checked first?","options":["GDS layer color choices","The git branch name","Metal density only","Reset semantics and reachable initial states"],"answer":3,"why":"Sequential proofs depend on reset and state behavior."},{"q":"A cell's propagation delay changes with output load. Where is that dependency commonly characterized?","options":["Liberty timing tables","A Verilog parameter in the testbench","GDS top cell name","The LEF site name only"],"answer":0,"why":"Liberty tables capture delay versus input slew and load."},{"q":"A fast input transition becomes slow before a cell. What property changed?","options":["Wafer thickness","Input slew","Cell width","Clock frequency alone"],"answer":1,"why":"Slew is the transition rate/time at a pin."},{"q":"A register receives data too close before the active capture clock edge. Which check is threatened?","options":["Setup","Well tap placement","LVS","Metal antenna"],"answer":0,"why":"Setup requires sufficient data stability ahead of capture."},{"q":"A register input changes too soon after the capture edge. Which check is threatened?","options":["Antenna","Hold","Die seal ring","Logic equivalence"],"answer":1,"why":"Hold requires the old data to remain stable for a minimum interval after the edge."},{"q":"Which case can be a legitimate use of model checking?","options":["Proving an FSM never enters an illegal state","Measuring wire width by microscope","Estimating package weight","Generating photomasks directly"],"answer":0,"why":"Model checking explores state transitions against temporal properties."},{"q":"What does a Boolean technology library function such as Y=A&B specify?","options":["Cell logic behavior","Exact location of the cell in the final layout","A user's waveform dump policy","A clock tree endpoint"],"answer":0,"why":"Library functions state the logical relationship of pins."},{"q":"An engineer removes a buffer during optimization. What should be reconsidered before accepting the change?","options":["The number of lines in the Tcl script","Only the timestamp on the report","Fanout delay, slew and equivalence","Wafer packaging color"],"answer":2,"why":"Removing a buffer can change electrical timing while preserving logic."},{"q":"What is a dangerous conclusion from proving one selected output bit equivalent?","options":["That selected bit matches under assumptions","That the proof had a defined scope","That the miter has no mismatch for that bit","That every unproved output and state property is also equivalent"],"answer":3,"why":"Proof results should not be generalized beyond their checked properties."}],"quiz":[{"q":"What is a miter circuit for combinational equivalence?","options":["A scan chain bypass","A comparison that XORs corresponding outputs of two designs","A routing blockage","A power-grid strap"],"answer":1,"why":"A nonzero miter output indicates disagreement for some shared input."},{"q":"What does UNSAT mean for a properly built equivalence miter's mismatch output?","options":["The library is missing","The clock is too fast","No modeled input makes the designs disagree","The designs necessarily disagree"],"answer":2,"why":"If mismatch=1 is unsatisfiable, no counterexample exists under the model."},{"q":"What must sequential equivalence additionally consider?","options":["Only color of the RTL editor","Metal line pitch only","State and reset semantics","Only input pin locations"],"answer":2,"why":"Sequential designs depend on state evolution, initial conditions and reset."},{"q":"Which file format commonly describes standard-cell timing and power?","options":["VCD only","Liberty .lib","Tcl history","GDSII"],"answer":1,"why":"Liberty provides functional/timing/power models for library cells."},{"q":"Which quantity tends to affect a cell delay table?","options":["Git branch name","Verilog filename length","Number of whitespace lines","Output capacitance"],"answer":3,"why":"Cell delay depends on input transition and output load, among other operating conditions."},{"q":"What is input slew in cell timing?","options":["Transition time of the input signal","Number of vias in the cell","Frequency of firmware updates","Average die yield"],"answer":0,"why":"Slew describes how quickly an electrical transition occurs."},{"q":"What does a setup constraint require?","options":["Data change as late as possible after clock edge","Input be always high","Clock run at 0 Hz","Data stable sufficiently before capturing clock edge"],"answer":3,"why":"Setup time is a minimum pre-edge data stability requirement."},{"q":"What does a hold constraint require?","options":["Data stable for an interval after capturing edge","Clock never toggle","Output load be zero","No combinational gate can exist"],"answer":0,"why":"Hold time is a post-edge stability requirement."},{"q":"What does model checking typically analyze?","options":["The yield of bond wires only","VLSI packaging adhesive","Lithographic exposure dose only","State-transition behavior against properties"],"answer":3,"why":"Model checking explores a transition system to validate properties."},{"q":"What is a sensible post-optimization validation step?","options":["Remove all constraints","Rename every cell by hand","Assume the code is identical because both files compile","Check functional equivalence and timing"],"answer":3,"why":"Optimization must preserve functionality while meeting physical requirements."}],"resources":[["Day 04 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2004%20-%20Multilevel%20Optimization%20and%20Formal%20Verification.pdf"],["Day 04 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2004.md"],["Day 05 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2005%20-%20Equivalence%20Libraries%20and%20Static%20Timing%20Analysis.pdf"],["Day 05 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2005.md"]]},{"number":7,"title":"Static timing analysis","videos":[{"id":28,"title":"Static Timing Analysis - I","youtube":"qC5ZPVaOgTI","duration":"52:40","tutorial":false},{"id":29,"title":"Static Timing Analysis - II","youtube":"ftkMDGJY6cg","duration":"74:16","tutorial":false},{"id":30,"title":"Static Timing Analysis - III","youtube":"NOOXX3OIvj4","duration":"60:38","tutorial":false},{"id":31,"title":"Static Timing Analysis using OpenSTA","youtube":"fKKuQGoirfM","duration":"14:07","tutorial":true}],"notes":[["Timing graph","Pins are vertices; combinational cell and interconnect timing arcs are edges. STA propagates timing without input vectors."],["Arrival and required","Setup slack = required arrival − actual arrival. Negative setup slack is a timing violation."],["Setup path","A simplified same-clock constraint is t_cq + t_comb + t_setup <= T + (capture skew) − uncertainty."],["Hold path","Minimum data delay must satisfy a hold relationship at the capture flop; faster logic can make hold worse."],["Graph vs path","Graph-based analysis merges arrival bounds at nodes; path-based analysis can reduce pessimism on specific paths."],["PVT/derates","Analyze appropriate process corners, voltage, temperature, on-chip variation and wire parasitics."],["OpenSTA example","read_liberty cells.lib; read_verilog netlist.v; link_design top; read_sdc constraints.sdc; report_checks."]],"lab":"Create a .lib + mapped netlist + .sdc test and inspect setup/hold reports in OpenSTA; trace a path startpoint-to-endpoint.","assignment":[{"q":"A path has required arrival 8.0 ns and data arrival 8.3 ns. What is its setup slack?","options":["+0.3 ns","−0.3 ns","8.3 ns","16.3 ns"],"answer":1,"why":"Slack = required time − arrival time."},{"q":"A hold path has a minimum arrival later than its hold required time. What does that generally imply?","options":["Physical DRC failure","Guaranteed setup failure","Missing clocks","Positive hold margin"],"answer":3,"why":"Hold checks ensure data does not arrive too early."},{"q":"A timing engine combines worst arrivals at graph vertices. Which method is described?","options":["Layout versus schematic","Graph-based analysis","Wafer-level testing","Gate-level random simulation only"],"answer":1,"why":"GBA propagates arrivals through a timing graph."},{"q":"Why might path-based analysis report a different result from graph-based STA?","options":["It can reduce pessimism associated with independent graph arrivals","It changes the clock period","It ignores all cell delays","It is identical to analog SPICE for all paths"],"answer":0,"why":"PBA follows a specific path and can be less pessimistic."},{"q":"Which register pin commonly represents a setup timing endpoint?","options":["Q output of the launch flop","LEF ORIGIN field","D input of the capture flop","Power pin of a tap cell"],"answer":2,"why":"Setup timing ends at the receiving sequential input."},{"q":"A timing report lists a path launched at a flop Q. What defines the start of the data path?","options":["Clock-to-Q launch event","The first output pad regardless of path","The die boundary","The last CTS buffer only"],"answer":0,"why":"Register-to-register analysis launches from a source register."},{"q":"What is an immediate risk of omitting the clock definition from a timing run?","options":["Guaranteed signoff timing pass","Conversion to analog netlist","Missing or unconstrained paths","Automatic perfect clock tree synthesis"],"answer":2,"why":"STA relies on clocks and constraints to establish timing requirements."},{"q":"Why are slow and fast PVT corners both relevant?","options":["Only one corner can have legal geometry","Setup and hold extremes may occur under different conditions","Fast silicon never affects hold","Process variation affects only transistor counts"],"answer":1,"why":"Different corners can govern maximum and minimum delays."},{"q":"An OpenSTA report_checks path shows a negative slack. What is the sensible next step?","options":["Assume equivalence is broken","Ignore it because STA never uses vectors","Immediately create GDS with no review","Inspect critical path arcs and constraints before optimizing"],"answer":3,"why":"Violations require diagnosis of path and constraints."},{"q":"A timing path is declared false but actually functionally sensitizable. What is the danger?","options":["DRC automatically catches it","STA may fail to report a real timing violation","The tool necessarily makes all cells smaller","The false-path exception increases clock frequency"],"answer":1,"why":"Incorrect exceptions can hide genuine timing problems."}],"quiz":[{"q":"What is setup slack generally computed as?","options":["Cell area times clock period","Actual time plus required time","Required arrival time minus actual arrival time","Clock period divided by frequency"],"answer":2,"why":"A negative setup slack indicates arrival after the required boundary."},{"q":"Which timing analysis method does not require a specific input vector?","options":["Static timing analysis","ATPG scan shift","Wafer sort","Ordinary event-driven functional simulation"],"answer":0,"why":"STA propagates timing arcs independently of a particular testbench vector sequence."},{"q":"What is a timing startpoint typically?","options":["A primary input or launching register","A mask layer color","A via master","A DEF row"],"answer":0,"why":"STA starts at inputs or launch endpoints, depending on path type."},{"q":"What is a timing endpoint typically?","options":["An antenna diode only","A primary output or capturing register","A GDS hierarchy name only","A TCL brace"],"answer":1,"why":"Timing checks terminate at outputs or register data pins."},{"q":"Which delay is normally used for hold checking?","options":["Average package weight","Minimum data path delay","Only input clock period","Maximum data path delay only"],"answer":1,"why":"Hold failures arise when data arrives too early."},{"q":"What does a negative setup slack indicate?","options":["No clock exists on chip","Power rail open","Guaranteed correct timing","Timing requirement is violated"],"answer":3,"why":"Arrival is later than required for that path/corner."},{"q":"Why consider process-voltage-temperature corners?","options":["It guarantees zero skew","Cell and wire timing vary with operating conditions","It changes RTL syntax rules","It is required only for drawing schematics"],"answer":1,"why":"PVT shifts transistor and interconnect behavior."},{"q":"What is graph-based timing propagation?","options":["Delete clock paths","Physically route each net with a graph pencil","Simulate each logic vector exhaustively","Carry bounds along arcs through the timing graph"],"answer":3,"why":"STA computes time bounds at pins via graph edges."},{"q":"What does report_checks in OpenSTA normally show?","options":["Silicon wafer map","Only Verilog comments","Timing paths and their slack","Only GDS geometry"],"answer":2,"why":"OpenSTA reports analyzed start/endpoints and timing checks."},{"q":"Which source is commonly required to run meaningful gate-level STA?","options":["A library, netlist and timing constraints","Only a screenshot of Verilog","Only a GitHub URL","Only the top module name"],"answer":0,"why":"STA needs timing models, connectivity, and defined timing requirements."}],"resources":[["Day 05 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2005%20-%20Equivalence%20Libraries%20and%20Static%20Timing%20Analysis.pdf"],["Day 05 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2005.md"],["Day 06 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2006%20-%20OpenSTA%20and%20Clock%20Constraints.pdf"],["Day 06 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2006.md"]]},{"number":8,"title":"SDC constraints, mapping & optimization","videos":[{"id":32,"title":"Constraints I","youtube":"rLhnmyGYsuQ","duration":"54:44","tutorial":false},{"id":33,"title":"Constraints II","youtube":"psrHHK7GFiY","duration":"38:55","tutorial":false},{"id":34,"title":"Technology Mapping","youtube":"ooOZagskglo","duration":"30:35","tutorial":false},{"id":35,"title":"Timing-driven Optimization","youtube":"xLw7xAosmtI","duration":"49:32","tutorial":false},{"id":36,"title":"Technology Library and Constraints","youtube":"u_XXFBwTXRk","duration":"18
