al vector-merging (carry-propagate) adder produces the product."],["Signed multiplication","Baugh–Wooley style: complement selected partial-product bits and add correction constants instead of fully sign-extending each row."]],"lab":"Hand-multiply two signed 4-bit numbers using two's complement and sign extension; verify in Python.","assignment":[{"q":"The range of an 8-bit two's complement number is:","options":["−128 to 128","−128 to 127","0 to 255","−127 to 127"],"answer":1,"why":"−2⁷ … 2⁷ − 1."},{"q":"−5 in 4-bit two's complement is:","options":["1011","1101","1010","0101"],"answer":0,"why":"5 = 0101 → invert 1010 → +1 = 1011."},{"q":"Sign-extending the 4-bit value 1011 to 8 bits gives:","options":["00001011","10001011","11110101","11111011"],"answer":3,"why":"Replicate the MSB (1)."},{"q":"Signed overflow in two's complement addition occurs when:","options":["Two same-sign operands give an opposite-sign result","The result is zero","The carry-out is 1","Operands have different signs"],"answer":0,"why":"Carry-out alone signals unsigned overflow, not signed."},{"q":"An N×N array multiplier generates how many partial-product bits?","options":["2N","N","N log N","N²"],"answer":3,"why":"Every a_i·b_j pair."},{"q":"Multiplying an N-bit by an M-bit unsigned number needs a product width of:","options":["N·M bits","N + M − 2 bits","max(N, M)","N + M bits"],"answer":3,"why":"(2^N − 1)(2^M − 1) < 2^{N+M}."},{"q":"The key benefit of a carry-save multiplier is:","options":["Carries move to the next row instead of rippling within a row","It uses no AND gates","It needs no adders","It works only for signed numbers"],"answer":0,"why":"That makes the critical path regular and shorter."},{"q":"The last stage of a carry-save multiplier is:","options":["A Booth encoder","A vector-merging (carry-propagate) adder","A comparator","A shift register"],"answer":1,"why":"It merges the remaining sum and carry vectors."},{"q":"Each partial-product bit a_i·b_j is produced by:","options":["An AND gate","A full adder","A mux","An XOR gate"],"answer":0,"why":"Bit multiplication = AND."},{"q":"The Baugh–Wooley method handles:","options":["Carry-skip addition","Floating-point rounding","Unsigned division","Signed multiplication by complementing some PP bits and adding constants"],"answer":3,"why":"Avoids full sign extension of every row."}],"solution":{"youtube":"gpF_n5FqsxE","duration":"10:15"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":11,"title":"Pipelining & flip-flops","videos":[{"id":68,"title":"SeqCkt 1 - Introduction to Pipelining","youtube":"JCaD0Rj3sZw","duration":"24:32","tutorial":false},{"id":69,"title":"SeqCkt 2 - Time Borrowing","youtube":"njw0HHbKUpU","duration":"22:18","tutorial":false},{"id":70,"title":"SeqCkt 3 - Master Slave Flip Flop","youtube":"sio7vaSBpyg","duration":"26:12","tutorial":false},{"id":71,"title":"SeqCkt 4 - Flop Timing Parameters","youtube":"KXjPB4sqhhY","duration":"28:20","tutorial":false},{"id":72,"title":"SeqCkt 5 - Alternate Circuit Implementations","youtube":"gN0vGJyWTRY","duration":"22:00","tutorial":false},{"id":73,"title":"SeqCkt 6 - Clock Overlap","youtube":"hBsL13gu3uY","duration":"32:18","tutorial":false}],"notes":[["Pipelining","Registers split logic into stages: throughput rises; latency (in time) rises slightly due to register overhead. Tc ≥ tpcq + tpd,logic + tsetup."],["Time borrowing","With level-sensitive latches a slow stage can use time from the next phase while the latch is transparent."],["Master–slave flop","Two latches in series: master transparent when clk is low, slave when high → positive-edge triggered."],["Timing parameters","Setup: data stable before the edge. Hold: stable after the edge. tcq: clock-to-Q delay. Latches add D-to-Q delay."],["Implementations","Transmission-gate latches, C2MOS (clocked inverters), TSPC and pulsed latches trade clock load, robustness and speed."],["Clock overlap","If clk and clk̄ overlap, master and slave can be transparent together and data races through."]],"lab":"Pipeline a 900 ps datapath into 2, 3 and 4 stages with 80 ps register overhead; tabulate Tc and latency.","assignment":[{"q":"Pipelining primarily improves:","options":["Latency","Throughput","Area","Leakage"],"answer":1,"why":"More results per second; each result still takes at least as long."},{"q":"In a positive-edge master–slave flop, the master latch is transparent when:","options":["Never","Always","clk is low","clk is high"],"answer":2,"why":"Master samples while low; slave passes on the rising edge."},{"q":"Setup time is:","options":["Clock period","How long after the edge data must be stable","Clock-to-Q delay","How long data must be stable before the clock edge"],"answer":3,"why":"Violations cause metastability or wrong capture."},{"q":"Hold time is:","options":["Clock-to-Q delay","Logic delay","How long before the edge","How long data must stay stable after the clock edge"],"answer":3,"why":"Prevents the new value racing into the same capture."},{"q":"tpcq = 50 ps, logic 400 ps, tsetup = 50 ps. Max clock frequency = ?","options":["5 GHz","1 GHz","2.5 GHz","2 GHz"],"answer":3,"why":"Tc = 500 ps."},{"q":"Time borrowing is possible with:","options":["Level-sensitive latches","Edge-triggered flops only","SR latches only","Asynchronous resets"],"answer":0,"why":"A transparent latch lets late data pass into the next phase."},{"q":"Clock overlap is dangerous in master–slave flops because:","options":["It reduces setup time to zero","It stops the clock","It increases leakage","Both latches can be transparent → race-through"],"answer":3,"why":"Data can pass both stages in one edge."},{"q":"A 900 ps block split into 3 equal stages with 100 ps register overhead per stage gives Tc = ?","options":["333 ps","400 ps","300 ps","1000 ps"],"answer":1,"why":"300 ps logic + 100 ps overhead."},{"q":"The latency of that 3-stage pipeline is:","options":["0.9 ns","1.2 ns","0.4 ns","1.0 ns"],"answer":1,"why":"3 × 400 ps — higher than the unpipelined 1.0 ns."},{"q":"A latch differs from a flip-flop in that a latch is:","options":["Always transparent","Edge-triggered","Level-sensitive","Unclocked"],"answer":2,"why":"Transparent for a whole clock phase."}],"solution":{"youtube":"yrujyqUWyQo","duration":"15:30"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":12,"title":"Flop & latch timing analysis","videos":[{"id":74,"title":"SeqCkt 7 - C2MOS Flop","youtube":"ChXyZgRxzwc","duration":"41:19","tutorial":false},{"id":75,"title":"SeqCkt 8 - Flop Characterization","youtube":"n6qCbhGjIWI","duration":"14:47","tutorial":false},{"id":76,"title":"SeqCkt 9 - Max and Min Delay of Flop Based Systems","youtube":"LdJdZp1_fkE","duration":"30:59","tutorial":false},{"id":77,"title":"SeqCkt 10 - Flop Min Delay Constraint","youtube":"1go28PgIUAg","duration":"13:28","tutorial":false},{"id":78,"title":"SeqCkt 11 - Latch: Max and Min Delay Constraints","youtube":"QIL-eT6tB0Q","duration":"41:54","tutorial":false},{"id":79,"title":"SeqCkt 12 - Latch Timing Analysis with Skew","youtube":"4Z75hLK9_Qs","duration":"38:04","tutorial":false},{"id":80,"title":"SeqCkt 13 - Time Borrowing","youtube":"gJ0Q5GJsHqk","duration":"15:24","tutorial":false}],"notes":[["C2MOS flop","Clocked-inverter latches; insensitive to 0-0 / 1-1 clock overlap as long as clock edges are sharp."],["Characterization","As data arrives closer to the edge, tcq rises. Setup time is defined where tcq degrades by a chosen amount; hold is found the same way on the other side."],["Max-delay (setup)","Flops: tpcq + tpd + tsetup ≤ Tc − tskew (when skew hurts)."],["Min-delay (hold)","tccq + tcd ≥ thold + tskew. Independent of clock period — slowing the clock cannot fix a hold violation; add delay on the short path."],["Latch constraints","Two-phase latches: logic budget per cycle ≈ Tc − 2·tpdq. Min-delay checks include the non-overlap (or overlap) of the two phases."],["Skew & borrowing","Late capture clock helps setup, hurts hold. Latch-based paths absorb skew and allow borrowing up to the transparency window minus setup."]],"lab":"Write setup/hold slack for a flop-to-flop path with ±skew; find the smallest Tc and fix a hold violation with buffers.","assignment":[{"q":"Flop-based setup constraint (no skew):","options":["tpcq + tpd + tsetup ≤ Tc","tccq + tcd ≥ thold","Tc ≤ tsetup","tpd ≤ thold"],"answer":0,"why":"Data must arrive a setup time before the next edge."},{"q":"Flop-based hold constraint (no skew):","options":["tcd ≤ thold","tccq + tcd ≥ thold","thold ≥ Tc","tpcq + tpd ≤ Tc"],"answer":1,"why":"The fastest new data must not corrupt the current capture."},{"q":"A hold violation is fixed by:","options":["Speeding up the clock","Adding delay on the short path","Slowing the clock","Raising VDD"],"answer":1,"why":"Hold is independent of Tc."},{"q":"tpcq = 60, tpd = 700, tsetup = 40, skew = 50 ps (hurting setup). Minimum Tc = ?","options":["750 ps","900 ps","800 ps","850 ps"],"answer":3,"why":"60 + 700 + 40 + 50."},{"q":"tccq = 30 ps, tcd = 20 ps, thold = 60 ps (no skew). Hold slack = ?","options":["−50 ps","−10 ps (violation)","0 ps","+10 ps"],"answer":1,"why":"30 + 20 − 60."},{"q":"If the capture clock arrives later than the launch clock, skew:","options":["Helps both","Helps setup, hurts hold","Hurts both","Hurts setup, helps hold"],"answer":1,"why":"The capture edge moves away from launch data but closer to the next launch."},{"q":"In a latch-based design, a slow stage can borrow time from:","options":["The following stage","The previous stage","Nowhere","The clock generator"],"answer":0,"why":"Data passes through the transparent latch late."},{"q":"A C2MOS latch is built from:","options":["SR NOR latches","Pseudo-NMOS gates","Pass transistors only","Clocked inverters (series clocked transistors)"],"answer":3,"why":"Clocked CMOS is robust to clock overlap when edges are sharp."},{"q":"In flop characterization, as data arrives closer to the clock edge:","options":["tcq is unchanged","Hold time becomes negative","tcq increases","tcq decreases"],"answer":2,"why":"Setup is defined where tcq degrades by a set amount."},{"q":"Which constraint does not depend on the clock period?","options":["Hold (min-delay)","Neither","Setup (max-delay)","Both"],"answer":0,"why":"Hold compares launch and capture on the same edge."}],"solution":{"youtube":"b-jRniCrzBg","duration":"22:28"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]}]}];

    for(const [k,r] of Object.entries(st.tests)){let a='';for(let i=0;i<10;i++)a+=r.ans[i]!==undefined?r.ans[i]:'-';t[k]=[r.sub?1:0,r.score??-1,a]}
    const cut=dkey(new Date(Date.now()-days*864e5));for(const [k,n] of Object.entries(st.activity))if(k>=cut&&n)ac[k]=n;
    const pos={};for(const [c,p] of Object.entries(st.pos))pos[c]=[p.view,p.tab,p.vid];
    return {u:st.updated||0,th:st.theme,co:st.course,em:st.embed,p:pos,d,t,ac};
  }
  function unpack(o){
    const st={done:{},tests:{},activity:o.ac||{},pos:{},theme:o.th||'dark',course:o.co,embed:o.em||'auto',updated:o.u||0};
    for(const [c,ids] of Object.entries(o.d||{}))for(const id of ids)st.done[`${c}:v:${id}`]=1;
    for(const [k,[sub,sc,a]] of Object.entries(o.t||{})){const ans={};[...a].forEach((ch,i)=>{if(ch!=='-')ans[i]=+ch});st.tests[k]={ans,sub:!!sub,score:sc<0?null:sc}}
    for(const [c,[v,tab,vid]] of Object.entries(o.p||{}))st.pos[c]={view:v,tab,vid};
    return st;
  }
  function read(){try{const m=get(CK+'_m');if(!m)return null;const cnt=+m;if(!(cnt>0&&cnt<=3))return null;
    let d='';for(let i=0;i<cnt;i++){const x=get(CK+'_'+i);if(x===null)return null;d+=x}return unpack(JSON.parse(decodeURIComponent(d)))}catch(e){return null}}
  function write(st){try{if(!navigator.cookieEnabled)return false;let d;
    for(const days of [365,120,30,0]){d=encodeURIComponent(JSON.stringify(pack(st,days)));if(d.length<=MAXLEN)break}
    if(d.length>MAXLEN)return false;
    const cnt=Math.ceil(d.length/PART),prev=+(get(CK+'_m')||0)||0;
    for(let i=0;i<cnt;i++)put(CK+'_'+i,d.slice(i*PART,(i+1)*PART),AGE);
    for(let i=cnt;i<Math.max(prev,40);i++)if(get(CK+'_'+i)!==null)put(CK+'_'+i,'',0); // also clears old oversized versions
    put(CK+'_m',String(cnt),AGE);return read()!==null}catch(e){return false}}
  return {read,write};
})();
let lastLocal=[true,true];
function paintSave(ls,ck){if(ls!==undefined)lastLocal=[ls,ck];[ls,ck]=lastLocal;const el=$('save');if(!el)return;
  const ok=ls||ck;el.className='save '+(ok?'ok':'err');el.lastElementChild.textContent=ok?'saved':'not saved';
  el.title=ck&&ls?'Saved in cookies + this browser':ck?'Saved in cookies':ls?'Saved in this browser (cookies unavailable here)':'This browser is blocking storage — export a backup from settings'}

const blank=()=>({v:1,theme:'dark',course:COURSES[0].id,embed:'auto',pos:{},done:{},tests:{},notes:{},resume:{},activity:{},updated:0});
function clean(s){const b=blank();if(!s||typeof s!=='object')return b;for(const k of Object.keys(b)){if(s[k]!==undefined&&typeof s[k]===typeof b[k])b[k]=s[k]}if(!byId[b.course])b.course=COURSES[0].id;return b}
function fromOld(o){ // GPT tracker → new format (course rtl)
  const s=blank();if(!o)return s;
  for(const [k,v] of Object.entries(o.done||{})){const m=k.match(/^v-(\d+)$/);if(m&&v)s.done[`rtl:v:${m[1]}`]=1}
  const take=(ans,sc,kind)=>{for(const w of Object.keys({...(o[ans]||{}),...(o[sc]||{})})){const t={ans:{...((o[ans]||{})[w]||{})},sub:false,score:null};const r=(o[sc]||{})[w];if(r){t.sub=true;t.score=typeof r.score==='number'?r.score:null}s.tests[`rtl:${kind}:${w}`]=t}};
  take('assignmentAnswers','assignmentScores','a');take('answers','quizzes','q');
  for(const [d,n] of Object.entries(o.activity||{}))s.activity[d]=Number(n)||0;
  if(o.theme==='light')s.theme='light';
  if(o.lastWeek)s.pos.rtl={view:Number(o.lastWeek)||'overview',tab:'lectures'};
  return s;
}
function load(){
  let ls=null,ck=null;try{const raw=localStorage.getItem(KEY);if(raw)ls=clean(JSON.parse(raw))}catch(e){}
  ck=Store.read();if(ck)ck=clean(ck);
  if(ls&&!(ck&&(ck.updated||0)>(ls.updated||0)))return ls;
  if(ck){if(ls){ck.notes=ls.notes;ck.resume=ls.resume}return ck}
  try{const raw=localStorage.getItem(OLD_KEY);if(raw){const s=fromOld(JSON.parse(raw));setTimeout(()=>toast('Imported progress from your old tracker'),400);return s}}catch(e){}
  return blank();
}

function save(now,quiet){clearTimeout(saveT);if(!quiet)dirty=true;const run=()=>{if(dirty){S.updated=Date.now();dirty=false}let ls=false;try{localStorage.setItem(KEY,JSON.stringify(S));ls=true}catch(e){}const ck=Store.write(S);storageOK=ls||ck;paintSave(ls,ck)};now?run():saveT=setTimeout(run,250)}

function weekProg(c,w){const C_=byId[c],W=C_.weeks[w-1];let d=W.videos.filter(v=>isDone(c,v.id)).length,t=W.videos.length;
  t++;if(test(c,'a',w)?.sub)d++;

function courseProg(c){let d=0,t=0,vd=0,vt=0,sd=0,st=0,a=0,as=0,ap=0;for(const W of byId[c].weeks){const [x,y]=weekProg(c,W.number);d+=x;t+=y;for(const v of W.videos){st+=secs(v.duration);vt++;if(isDone(c,v.id)){vd++;sd+=secs(v.duration)}}const r=test(c,'a',W.number);if(r?.sub){a++;if(typeof r.score==='number'){as+=r.score;ap+=W.assignment.length}}}
  return {d,t,pct:t?Math.round(d/t*100):0,vd,vt,sd,st,a,avg:ap?Math.round(as/ap*100):null}}
function allVideos(c){return byId[c].weeks.flatMap(W=>W.videos.map(v=>({...v,week:W.number})))}

function heatmap(){
  const today=new Date();today.setHours(12,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-start.getDay()-52*7);
  const cells=[],months=[];let total=0,lastM=-1;
  for(let col=0;col<53;col++){const first=new Date(start);first.setDate(start.getDate()+col*7);
    if(first.getMonth()!==lastM&&first.getDate()<=7&&col<51){months.push(`<span class="m" style="grid-column:${col+2}">${first.toLocaleString('en',{month:'short'}).toLowerCase()}</span>`);lastM=first.getMonth()}
    for(let r=0;r<7;r++){const d=new Date(start);d.setDate(start.getDate()+col*7+r);const k=dkey(d),n=S.activity[k]||0,fut=d>today;if(!fut)total+=n;
      const l=n===0?0:n<2?1:n<4?2:n<7?3:4;
      cells.push(`<i style="grid-column:${col+2};grid-row:${r+2}" data-l="${l}" class="${fut?'fut':''}${k===dkey(today)?' today':''}" title="${n} item${n===1?'':'s'} · ${d.toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'})}"></i>`)}}
  let streak=0;const d=new Date(today);if(!S.activity[dkey(d)])d.setDate(d.getDate()-1);while(S.activity[dkey(d)]){streak++;d.setDate(d.getDate()-1)}
  let best=0,cur=0;const days=Object.keys(S.activity).filter(k=>S.activity[k]>0).sort();let prev=null;for(const k of days){const t=new Date(k+'T12:00:00');cur=prev&&(t-prev)/864e5<1.5?cur+1:1;best=Math.max(best,cur);prev=t}
  const active=Object.values(S.activity).filter(n=>n>0).length;
  return `<div class="card heatwrap"><div class="heatscroll" id="hs"><div class="heat">${months.join('')}<span class="d" style="grid-row:3">mon</span><span class="d" style="grid-row:5">wed</span><span class="d" style="grid-row:7">fri</span>${cells.join('')}</div></div>
   <div class="heatfoot"><span>${total} items in the last year · ${active} active day${active===1?'':'s'} · streak <b class="acc">${streak}d</b> · best ${best}d</span>
   <span class="legend">less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> more</span></div></div>`;
}

  const m=$('markBtn');if(m){const d=isDone(c.id,Number(m.dataset.id));m.className='btn '+(d?'done':'pri');m.textContent=d?'✓ done':'mark as done'}
  const lc=$('lcount');if(lc)lc.textContent=`${W.videos.filter(x=>isDone(c.id,x.id)).length}/${W.videos.length} done`;
  const tc=document.querySelector('[data-tab="lectures"] .tc');if(tc){const n=W.videos.filter(x=>isDone(c.id,x.id)).length;tc.textContent=`${n}/${W.videos.length}`;tc.classList.toggle('ok',n===W.videos.length)}
}
function toggleDone(id){const c=C(),k=`${c.id}:v:${id}`;if(S.done[k])delete S.done[k];else{S.done[k]=1;bump()}save();renderSide();refreshLectureMarks()}
function stepVideo(dir){const c=C(),pos=P();if(typeof pos.view!=='number')return;const W=c.weeks[pos.view-1],i=W.videos.findIndex(v=>v.id===pos.vid);
  if(pos.tab!=='lectures'){pos.tab='lectures';renderWeek();return}
  const j=i+dir;if(j>=0&&j<W.videos.length){pos.vid=W.videos[j].id;save();renderLectures(W)}
  else if(dir>0&&W.number<12){go(W.number+1);P().vid=c.weeks[W.number].videos[0].id;renderWeek()}
  else if(dir<0&&W.number>1){go(W.number-1);const pw=c.weeks[W.number-2];P().vid=pw.videos[pw.videos.length-1].id;renderWeek()}}

/* ---------- tests ---------- */
function renderTest(W,kind){
  const c=C(),qs=kind==='a'?W.assignment:W.quiz,k=`${c.id}:${kind}:${W.number}`,r=S.tests[k]||{ans:{},sub:false,score:null},sub=r.sub;
  const answered=Object.keys(r.ans).length,L='abcd';
  const title=kind==='a'?'assignment':'practice quiz';
  const score=sub?qs.reduce((s,q,i)=>s+(Number(r.ans[i])===q.answer?1:0),0):0;
  $('pane').innerHTML=`<div class="thead"><div><h3>${title} · week ${pad(W.number)}</h3><div class="sub">${qs.length} questions · answers save as you click</div></div>
   <div class="row">${kind==='a'&&c.assignmentLink?`<a class="btn ghost" href="${esc(c.assignmentLink[1])}" target="_blank" rel="noopener">${esc(c.assignmentLink[0])} ↗</a>`:''}${kind==='q'?`<a class="btn ghost" href="${esc(c.links.find(l=>/Practice MCQs/.test(l[0]))?.[1]||'#')}" target="_blank" rel="noopener">more questions ↗</a>`:''}</div></div>
   ${kind==='a'&&c.assignmentNote?`<div class="note">${esc(c.assignmentNote)}</div>`:''}
   ${kind==='a'&&W.solution?`<details class="sol card" id="sol"><summary>official solution walkthrough <span class="faint">· nptel · ${W.solution.duration}</span></summary><div class="solbody" id="solbody"></div></details>`:''}
   <div class="qs">${qs.map((q,i)=>{const ch=r.ans[i]!==undefined?Number(r.ans[i]):null,right=ch===q.answer;
     return `<div class="q" data-q="${i}"><div class="qn"><b>Q${pad(i+1)}</b>${sub?(ch===null?' · <span class="faint">skipped</span>':right?' · <span class="acc">correct</span>':' · <span style="color:var(--bad)">wrong</span>'):''}</div><div class="qp">${esc(q.q)}</div>
     <div class="opts">${q.options.map((o,j)=>{let cls='';if(sub){if(j===q.answer)cls='ok';else if(j===ch)cls='bad'}else if(j===ch)cls='sel';
       return `<button class="opt ${cls}" ${sub?'disabled':''} data-act="pick" data-kind="${kind}" data-i="${i}" data-j="${j}"><span class="lt">${L[j]})</span><span>${esc(o)}</span></button>`}).join('')}</div>
     ${sub?`<div class="why">${right?'<b class="ok">✓</b>':`<b class="bad">✗</b> answer: <b class="ok">${L[q.answer]})</b>`} ${esc(q.why||'')}</div>`:''}</div>`}).join('')}</div>
   <div class="tbar">${sub?`<div class="prog"><span class="score ${score/qs.length<.6?'low':''}">${score}/${qs.length}</span><span>${Math.round(score/qs.length*100)}% · submitted</span></div><button class="btn" data-act="retry" data-kind="${kind}">↺ retry</button>`
     :`<div class="prog"><span>${answered}/${qs.length} answered</span><div class="bar"><i style="width:${answered/qs.length*100}%"></i></div></div><button class="btn ghost" data-act="clear" data-kind="${kind}" ${answered?'':'disabled'}>clear</button><button class="btn pri" data-act="submit" data-kind="${kind}">submit</button>`}</div>`;
  const sol=$('sol');if(sol)sol.addEventListener('toggle',()=>{if(sol.open&&!$('solbody').innerHTML)$('solbody').innerHTML=playerHTML(W.solution.youtube,'',0).replace('id="ytf"','')});
}
function pick(kind,i,j){const c=C(),W=c.weeks[P().view-1],k=`${c.id}:${kind}:${W.number}`,r=S.tests[k]||(S.tests[k]={ans:{},sub:false,score:null});if(r.sub)return;r.ans[i]=j;save();
  const qEl=document.querySelector(`[data-q="${i}"]`);qEl.querySelectorAll('.opt').forEach((b,x)=>b.classList.toggle('sel',x===j));
  const qs=kind==='a'?W.assignment:W.quiz,n=Object.keys(r.ans).length,pr=document.querySelector('.tbar .prog');if(pr)pr.innerHTML=`<span>${n}/${qs.length} answered</span><div class="bar"><i style="width:${n/qs.length*100}%"></i></div>`;
  const cl=document.querySelector('[data-act="clear"]');if(cl)cl.disabled=false}
function submit(kind){const c=C(),W=c.weeks[P().view-1],k=`${c.id}:${kind}:${W.number}`,r=S.tests[k]||(S.tests[k]={ans:{},sub:false,score:null}),qs=kind==='a'?W.assignment:W.quiz,n=Object.keys(r.ans).length;
  if(!n){toast('Pick at least one answer first');return}
  if(n<qs.length&&!confirm(`${qs.length-n} unanswered. Submit anyway?`))return;
  r.sub=true;r.at=Date.now();r.score=qs.reduce((s,q,i)=>s+(Number(r.ans[i])===q.answer?1:0),0);r.at=Date.now();bump();save();
  toast(`<b>${r.score}/${qs.length}</b> · ${kind==='a'?'assignment':'quiz'} submitted`);renderSide();renderWeek();window.scrollTo({top:0,behavior:'smooth'})}
function retry(kind,clearOnly){const c=C(),W=c.weeks[P().view-1],k=`${c.id}:${kind}:${W.number}`;if(!clearOnly&&!confirm('Clear your answers and score for this set?'))return;delete S.tests[k];save();renderSide();renderWeek()}

/* ---------- notes ---------- */
function renderNotes(W){
  const c=C(),k=`${c.id}:${W.number}`,mine=S.notes[k]||'';
  $('pane').innerHTML=`<div class="ngrid"><div>
    <dl class="kd">${W.notes.map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl>
    ${W.lab?`<div class="card lab"><div class="k">$ hands-on</div><div>${esc(W.lab)}</div></div>`:''}
    ${W.resources?.length?`<div class="sec"><div class="sec-h"><h3>resources</h3></div><div class="res">${W.resources.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener"><span>${esc(l)}</span><span>↗</span></a>`).join('')}</div></div>`:''}
  </div>
  <div class="card mine"><div class="mh"><span>my notes · week ${pad(W.number)}</span><span class="row"><span class="faint" id="ncount">${mine.length?mine.length+' chars':'autosaves'}</span><button class="btn ghost" data-act="mdnotes" style="height:26px">↓ .md</button></span></div>
   <textarea id="mynotes" spellcheck="false" placeholder="// your notes for this week — formulas, doubts, timestamps…">${esc(mine)}</textarea></div></div>`;
  $('mynotes').addEventListener('input',e=>{S.notes[k]=e.target.value;if(!e.target.value)delete S.notes[k];$('ncount').textContent=e.target.value.length+' chars';save()});
}
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function mdNotes(){const c=C(),W=c.weeks[P().view-1];const md=`# ${c.name} — Week ${pad(W.number)}: ${W.title}\n\n## Key ideas\n${W.notes.map(([t,d])=>`- **${t}** — ${d}`).join('\n')}\n\n## Hands-on\n${W.lab||'-'}\n\n## Lectures\n${W.videos.map(v=>`- [${isDone(c.id,v.id)?'x':' '}] L${pad(v.id)} ${v.title} (${v.duration}) — https://youtu.be/${v.youtube}`).join('\n')}\n\n## My notes\n${S.notes[`${c.id}:${W.number}`]||''}\n`;
  download(`${c.id}_week${pad(W.number)}_notes.md`,md,'text/markdown;charset=utf-8')}

/* ---------- routing ---------- */
function go(view){const pos=P();if(view!=='overview'){view=Number(view);if(!(view>=1&&view<=12))return;if(pos.view!==view)pos.vid=null}pos.view=view;save();render();window.scrollTo({top:0})}
function render(){clearInterval(ytTimer);yt=null;applyTheme();renderSeg();renderSide();P().view==='overview'?renderOverview():renderWeek();document.title=`${C().short} · ${P().view==='overview'?'overview':'week '+pad(P().view)} — nptel/wrap`}
function applyTheme(){document.documentElement.className=S.theme==='light'?'light':'dark';$('themeBtn').textContent=S.theme==='light'?'☾':'☀'}

/* ---------- backup ---------- */
function exportBackup(){download(`nptel_wrap_progress_${dkey()}.json`,JSON.stringify({app:'nptel-wrap',version:1,exportedAt:new Date().toISOString(),state:S},null,2),'application/json');toast('<b>↓</b> progress saved to .json')}
function importBackup(file){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);let ns;
  if(j.app==='nptel-wrap'&&j.state)ns=clean(j.state);else if(j.app==='nptel-vlsi-108106191'&&j.state)ns=fromOld(j.state);else throw 0;
  if(!confirm('Replace current progress with this backup?'))return;S=ns;save(true);closeSettings();render();toast('<b>✓</b> backup restored')}catch(e){toast('Not a valid backup file')}};fr.readAsText(file)}


/* ---------- settings modal ---------- */
function openSettings(){$('ov').classList.remove('hide');renderSettings();document.body.style.overflow='hidden'}
function closeSettings(){$('ov').classList.add('hide');document.body.style.overflow=''}
function renderSettings(){
  const c=C();
  $('modal').innerHTML=`<div class="mhd"><h3>settings</h3><button class="ibtn" data-s="close" aria-label="Close">✕</button></div><div class="mbd">
   <section><div class="lbl2"><span>saving</span><span class="acc">${storageOK?'saved':'blocked'}</span></div><p>Everything saves automatically: core progress (lectures, answers, scores) in cookies, plus everything including notes in this browser's storage. Use ↓ save / ↑ load (top bar) to keep a .json copy or move progress to another device.</p></section>
   <section><div class="lbl2"><span>backup</span></div><p>A .json file with everything — lectures, answers, notes, activity. Also restores backups from the old GPT tracker.</p>
    <div class="row"><button class="btn" data-s="export">↓ export backup</button><button class="btn" data-s="import">↑ import backup</button></div></section>
   <section><div class="lbl2"><span>inline video player</span></div><p>Auto plays inside the page when it's served over http(s), like GitHub Pages; opened from disk it links out to YouTube.</p>
    <div class="segs">${['auto','on','off'].map(m=>`<button class="${S.embed===m?'on':''}" data-s="embed:${m}">${m}</button>`).join('')}</div></section>
   <section><div class="lbl2"><span>danger zone</span></div><p>Clears lectures, answers and notes for <b>${esc(c.name)}</b> only.</p>
    <button class="btn danger" data-s="reset">reset this course</button></section></div>`;
}
function settingsAct(a){
  if(a==='close')closeSettings();

  else if(a==='export')exportBackup();
  else if(a==='import')$('file').click();
  else if(a.startsWith('embed:')){S.embed=a.slice(6);save();render();renderSettings()}
  else if(a==='reset'){const c=C();if(confirm(`Reset ALL progress, answers and notes for "${c.name}"?`)){for(const o of [S.done,S.tests,S.notes,S.resume])for(const k of Object.keys(o))if(k.startsWith(c.id+':'))delete o[k];delete S.pos[c.id];save(true);render();closeSettings();toast('course reset')}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeSettings();return}
  const st=e.target.closest('[data-s]');if(st){if(!st.disabled)settingsAct(st.dataset.s);return}
  const t=e.target.closest('[data-course],[data-view],[data-tab],[data-act],[data-go]');if(!t||t.disabled)return;
  if(t.dataset.course){if(S.course!==t.dataset.course){S.course=t.dataset.course;save();render();window.scrollTo({top:0})}return}
  if(t.dataset.view!==undefined){go(t.dataset.view==='overview'?'overview':Number(t.dataset.view));return}
  if(t.dataset.tab){P().tab=t.dataset.tab;save();renderWeek();return}
  if(t.dataset.go){const [w,id]=t.dataset.go.split(':').map(Number);const pos=P();pos.view=w;pos.tab='lectures';pos.vid=id;save();render();window.scrollTo({top:0});return}
  const a=t.dataset.act,pos=P();
  if(a==='toggle')toggleDone(Number(t.dataset.id));
  else if(a==='play'){pos.vid=Number(t.dataset.id);save();renderLectures(C().weeks[pos.view-1]);if(innerWidth<1080)document.querySelector('.frame')?.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='nextv')stepVideo(1);else if(a==='prevv')stepVideo(-1);
  else if(a==='pick')pick(t.dataset.kind,Number(t.dataset.i),Number(t.dataset.j));
  else if(a==='submit')submit(t.dataset.kind);else if(a==='retry')retry(t.dataset.kind);else if(a==='clear')retry(t.dataset.kind,true);
  else if(a==='mdnotes')mdNotes();
  else if(a==='forceembed'){S.embed='on';save();render()}
  else if(a==='copycmd'){const cmd='py -m http.server 8000';(navigator.clipboard?.writeText(cmd)||Promise.reject()).then(()=>toast('<b>✓</b> copied: '+cmd),()=>prompt('Run this in the file\'s folder:',cmd))}
});
document.addEventListener('change',e=>{if(e.target.id==='mnav')go(e.target.value==='overview'?'overview':Number(e.target.value));if(e.target.id==='file'&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value=''}});
$('themeBtn').addEventListener('click',()=>{S.theme=S.theme==='light'?'dark':'light';save();applyTheme()});
$('menuBtn').addEventListener('click',openSettings);$('save').addEventListener('click',openSettings);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').classList.contains('hide')){closeSettings();return}if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;const pos=P();
  if(e.key==='Escape'){closeSettings();return}
  if(!$('ov').classList.contains('hide'))return;
  else if(e.key==='t'){S.theme=S.theme==='light'?'dark':'light';save();applyTheme()}
  else if(e.key===']'){go(pos.view==='overview'?1:Math.min(12,pos.view+1))}
  else if(e.key==='['){if(pos.view!=='overview')go(pos.view>1?pos.view-1:'overview')}
  else if(typeof pos.view==='number'){if(e.key==='j')stepVideo(1);else if(e.key==='k')stepVideo(-1);else if(e.key==='x'&&pos.tab==='lectures'&&pos.vid)toggleDone(pos.vid)}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=clean(JSON.parse(e.newValue));render()}catch(_){}}});
window.addEventListener('pagehide',()=>save(true,true));

render();save(true,true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save(true,true)});
})();
</script>
</body>
</html>
