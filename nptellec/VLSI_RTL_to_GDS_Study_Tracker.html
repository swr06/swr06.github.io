:05","tutorial":true}],"notes":[["SDC constraints","Specify clocks, input and output delays, uncertainty, I/O loads, driving cells and timing exceptions."],["Primary clocks","create_clock -name clk -period 10 [get_ports clk] creates a 10 ns clock on a port."],["Clock exceptions","False paths exclude timing checks; multicycle paths modify permissible capture edges. Both can hide real failures if misused."],["Technology mapping","Select available standard cells to implement Boolean/sequential functions; library timing/area shape choices."],["Optimization objective","Timing-driven synthesis sizes, duplicates, re-buffers or restructures logic to improve critical paths."],["Critical path","Worst negative slack and total negative slack summarize violating paths; report exact startpoints/endpoints."],["Constraints demo","OpenSTA connects .lib cell models, Verilog netlists and .sdc constraints; missing clocks or I/O delays make analysis incomplete."]],"lab":"Edit create_clock, input/output delays and clock uncertainty in an SDC and observe timing slack changes in OpenSTA.","assignment":[{"q":"A synchronous input is driven by an upstream device with up to 2 ns of delay. Which constraint models its arrival budget?","options":["set_false_path on all inputs","set_input_delay","set_max_fanout only","set_dont_touch on all registers"],"answer":1,"why":"Input delay accounts for external arrival relative to a clock."},{"q":"A designer defines create_clock -period 5 on a port. What is its nominal frequency?","options":["5 MHz","500 MHz","200 MHz","20 MHz"],"answer":2,"why":"1/(5 ns) = 200 MHz."},{"q":"An output port feeds a board-level component. Which external requirement is often needed for complete STA?","options":["The VCD filename","Output delay relative to the receiving clock","The number of source files","A GDS layer map only"],"answer":1,"why":"Output constraints reserve timing budget for external logic."},{"q":"What may happen if the clock uncertainty is unrealistically set to zero?","options":["All hold paths become false","Timing reports may be optimistic","Cells become faster after placement","Real jitter automatically disappears"],"answer":1,"why":"Uncertainty reserves margin for jitter and modeling variation."},{"q":"What does set_multicycle_path 2 usually communicate?","options":["A specified path has an allowed timing relationship spanning extra cycles","A register must toggle twice each cycle","The library has exactly two cells","The clock is divided by two everywhere"],"answer":0,"why":"Multicycle exceptions alter capture/launch relationships for selected paths."},{"q":"After mapping a NAND to the technology library, the output is slow due to high capacitive load. What is a plausible fix?","options":["Only change the die label","Increase the RTL source filename length","Choose a stronger drive cell or insert buffers","Remove all clock constraints"],"answer":2,"why":"Drive sizing and buffering address electrical load."},{"q":"Which trade-off can occur when a critical cell is upsized?","options":["The NAND becomes an XOR automatically","Better drive but larger area and input capacitance","No fanout change possible","Lower area and zero leakage guaranteed"],"answer":1,"why":"Bigger cells can be faster at a cost."},{"q":"A timing engineer checks WNS=−0.2 ns. How should it be interpreted?","options":["The clock delay is always 0.2 ns","Every path meets timing with margin","The design consumes −0.2 W","The worst reported setup slack is negative by 0.2 ns"],"answer":3,"why":"Worst negative slack summarizes the least favorable reported slack."},{"q":"Why does technology mapping require a known cell library?","options":["To generate simulation random seeds","To compile C into firmware","To draw chip artwork colors","To choose cells that exist and have characterized functions/costs"],"answer":3,"why":"Mapping depends on the cells and their functions, area and timing."},{"q":"What would happen if all asynchronous input paths were accidentally left unconstrained?","options":["All interface logic is automatically synchronized","DRC provides a replacement timing proof","Hold problems become impossible","Timing may appear clean while interface failures remain"],"answer":3,"why":"Unconstrained I/O paths evade meaningful timing analysis."}],"quiz":[{"q":"Which SDC command defines a primary clock?","options":["create_route","read_def","set_voltage","create_clock"],"answer":3,"why":"create_clock specifies the waveform and period at a design object."},{"q":"What does a 10 ns create_clock period correspond to?","options":["10 MHz","100 MHz","1 GHz","1 MHz"],"answer":1,"why":"1/(10 ns) = 100 MHz."},{"q":"What does set_input_delay express?","options":["Routing wire width","Design-rule enclosure","Cell leakage current","External input timing relative to a reference clock"],"answer":3,"why":"Input delay models arrival time at a chip boundary."},{"q":"Which timing exception can unintentionally hide a real setup violation?","options":["read_liberty","set_false_path","set_units","report_checks"],"answer":1,"why":"A false-path declaration removes paths from normal timing checking."},{"q":"What does a multicycle path constraint adjust?","options":["Allowed launch-to-capture cycle relationship","Number of functional inputs","Die dimensions","Number of metal layers"],"answer":0,"why":"Multicycle exceptions change timing edge relationships."},{"q":"What is technology mapping?","options":["Computing wafer yield","Selecting target library cells to implement logic","Assigning RTL text color","Package bond routing"],"answer":1,"why":"A Boolean/sequential network is expressed using available cells."},{"q":"Which cell change often improves a heavily loaded critical net?","options":["Remove the clock","Use a stronger driver or insert buffers","Replace all drivers with smaller cells unconditionally","Change signal comments"],"answer":1,"why":"Sizing/buffering can improve transition and delay with area/power cost."},{"q":"What is clock uncertainty used to model?","options":["Physical pin count","Metal thickness only","Timing margin for jitter/skew and other uncertainties","RTL compile time"],"answer":2,"why":"Uncertainty reduces available timing budget."},{"q":"Why are input and output delays important?","options":["They always improve silicon area","They constrain interfaces and external timing budgets","They determine lithography mask count","They automatically create a PDK"],"answer":1,"why":"Unconstrained I/O paths can make timing results misleading."},{"q":"What is WNS?","options":["Worst Negative Slack","Wafer Number Sequence","Worst Noise Source","Wire Net Size"],"answer":0,"why":"WNS highlights the single worst setup/hold slack among selected paths."}],"resources":[["Day 06 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2006%20-%20OpenSTA%20and%20Clock%20Constraints.pdf"],["Day 06 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2006.md"]]},{"number":9,"title":"Power analysis & design for test","videos":[{"id":37,"title":"Power Analysis","youtube":"u3--39QdD2Y","duration":"47:16","tutorial":false},{"id":38,"title":"Power Optimization","youtube":"-jYtXAHvoZM","duration":"37:47","tutorial":false},{"id":39,"title":"Basic Concepts of DFT","youtube":"1OoJG8CeFns","duration":"51:57","tutorial":false},{"id":40,"title":"Scan Design Flow","youtube":"7fGJto2F8JU","duration":"42:18","tutorial":false},{"id":41,"title":"Power Analysis using OpenSTA","youtube":"ZHk9e0KpHUY","duration":"17:49","tutorial":true}],"notes":[["Dynamic power","First-order switching term: P_dynamic ≈ α · C · V² · f, where α is activity factor."],["Static power","Leakage power grows with leakage current and supply voltage. Short-circuit power is another component during switching."],["Power reduction","Clock gating reduces clock-induced switching; DVFS trades performance for dynamic power; multi-Vt cells trade leakage and timing."],["DFT objective","Increase internal controllability and observability so manufacturing faults can be detected with practical patterns."],["Scan flip-flop","Adds a scan input and scan enable mux, allowing flip-flops to form shift chains in test mode."],["Scan operations","Shift in test data, capture response using functional clocks, then shift out the response to compare expected results."],["Power via OpenSTA","Estimated switching power needs activity information such as VCD/SAIF and valid cell power models."]],"lab":"Simulate scan-enable behavior for a D flip-flop with SI input, and estimate how switching activity affects dynamic power.","assignment":[{"q":"An internal net's switching activity falls by half while other variables remain fixed. Approximately what happens to its dynamic switching power?","options":["It falls by half","It becomes leakage-only immediately","It doubles","It stays exactly the same"],"answer":0,"why":"Dynamic switching power is proportional to activity factor."},{"q":"An implementation lowers Vdd from 1.0 V to 0.9 V with other factors fixed. Approximately what happens to CV²f power?","options":["It becomes 90%","It becomes 81% of its original value","It becomes 110%","It becomes 9%"],"answer":1,"why":"Switching power scales quadratically with supply voltage."},{"q":"What does clock gating ideally stop when a register bank is idle?","options":["Static timing checks","All transistor leakage throughout the chip","Every external input transition","Unnecessary clock transitions in the gated bank"],"answer":3,"why":"Clock gating reduces clock network and register switching."},{"q":"A designer inserts scan muxes on flip-flop inputs. Which capability is gained?","options":["Elimination of clock timing requirements","Automatic final placement","Serial control and observation of internal state","Guaranteed removal of all manufacturing faults"],"answer":2,"why":"Scan cells enable controlled shifting of internal register state."},{"q":"During scan loading, scan_enable is asserted. What should the flops capture?","options":["Data arriving through the scan chain","The analog supply voltage","Only functional data from combinational logic","A permanent logic zero at every flop"],"answer":0,"why":"Scan mode selects serial test input paths."},{"q":"ATPG generally aims to find patterns that do what?","options":["Remove the PDK requirement","Avoid using any sequential elements","Excite faults and propagate effects to observable outputs","Replace the RTL synthesis flow"],"answer":2,"why":"Manufacturing tests require faults to be observable."},{"q":"Why does long scan shift increase test time?","options":["It changes all cells to analog","It reduces the number of patterns to zero","Many shift clock cycles are required to load and unload chains","It adds physical wafers"],"answer":2,"why":"Shift cycles scale with chain length and pattern count."},{"q":"A power estimation run has no realistic switching probabilities or traces. What risk follows?","options":["Dynamic power may be poorly estimated","Scan coverage automatically improves","Timing becomes independent of frequency","Leakage necessarily becomes zero"],"answer":0,"why":"Activity is a major input to switching power."},{"q":"Why is power optimization constrained by timing?","options":["Gate size never affects delay","Reducing voltage or using smaller cells may slow paths","Timing is verified only before synthesis","Higher power always means worse timing"],"answer":1,"why":"Low-power changes can affect delays and margins."},{"q":"What is a realistic source of leakage even when clocks stop?","options":["Clock edge count alone","Subthreshold and gate leakage in transistors","Dynamic short-circuit events requiring transitions","VCD file writing"],"answer":1,"why":"Leakage has static device components that remain when idle."}],"quiz":[{"q":"Which expression approximates CMOS dynamic switching power?","options":["C ÷ V","R × I² × time only","alpha × C × V² × f","Area × clock skew"],"answer":2,"why":"Switching power scales with activity, switched capacitance, voltage squared and frequency."},{"q":"If supply voltage drops from 1.0 V to 0.8 V with other factors fixed, dynamic power changes to approximately what fraction?","options":["0.36","1.25","0.80","0.64"],"answer":3,"why":"Power scales as V squared, so 0.8² = 0.64."},{"q":"What does clock gating mainly reduce?","options":["Transistor count to zero","All leakage current to zero","Every timing constraint","Unnecessary clock-related switching activity"],"answer":3,"why":"Clock gating prevents clock toggles in inactive logic sections."},{"q":"What is a purpose of DFT?","options":["Eliminate packaging","Replace all RTL with GDS polygons","Prevent every soft error in the field","Improve internal controllability and observability for manufacturing tests"],"answer":3,"why":"Test structures make internal faults easier to excite and observe."},{"q":"What special input does a scan flip-flop have in addition to functional D?","options":["USB port","Microphone input","Analog antenna pin","Scan input"],"answer":3,"why":"SI is selected when the scan enable path is active."},{"q":"What happens during the scan shift phase?","options":["A clock tree is designed","The chip is diced","All metal routes are generated","Test bits are shifted along the scan chain"],"answer":3,"why":"The scan chain is configured as a shift register."},{"q":"What happens during scan capture?","options":["Functional response is sampled into scan flops","The clock is stopped forever","A new library is downloaded","GDS is fractured"],"answer":0,"why":"Capture observes the effect of applying a test vector."},{"q":"What is the scan enable signal used for?","options":["Select normal data input versus scan input","Configure compiler optimization level","Choose the core metal layer","Control output pad strength only"],"answer":0,"why":"A mux allows normal functional and test shift modes."},{"q":"What generally distinguishes leakage from dynamic power?","options":["Leakage can be consumed without switching","Leakage requires every flop toggling","Leakage depends only on operating system","Leakage is exactly zero at rest"],"answer":0,"why":"Transistors draw off-state currents even without state transitions."},{"q":"Which simulation artifact can provide switching activity for power estimation?","options":["DEF only","VCD or SAIF","GDS only","LEF site file only"],"answer":1,"why":"Activity traces/counts support dynamic power estimation."}],"resources":[["Day 07 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2007%20-%20Power%20Scan%20Design%20and%20ATPG.pdf"],["Day 07 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2007.md"]]},{"number":10,"title":"ATPG, BIST & physical design foundations","videos":[{"id":42,"title":"Automatic Test Pattern Generation (ATPG)","youtube":"oOVaTWGkVy8","duration":"47:05","tutorial":false},{"id":43,"title":"Built-in Self Test (BIST)","youtube":"iT_lXRDUdZI","duration":"45:56","tutorial":false},{"id":44,"title":"Basic Concepts for Physical Design - I","youtube":"r0rianLiAg4","duration":"61:41","tutorial":false},{"id":45,"title":"Basic Concepts for Physical Design - II","youtube":"uIZ7hVuZGHA","duration":"36:48","tutorial":false},{"id":46,"title":"Installation of OpenRoad","youtube":"FGpM8YYS6ic","duration":"06:05","tutorial":true}],"notes":[["ATPG","Automatic Test Pattern Generation searches input/scan vectors that activate a fault and propagate its effect to an observable output."],["Stuck-at model","A line is modeled as permanently 0 or 1; detection requires activation and propagation under an ATPG pattern."],["Fault coverage","Fault coverage ≈ detected modeled faults / total modeled faults. Coverage depends on the chosen fault model."],["BIST","Built-In Self-Test adds on-chip test-pattern generation and response checking, reducing external test equipment requirements."],["LFSR/MISR","Linear feedback shift registers can generate pseudo-random patterns; signature registers compact responses with some aliasing risk."],["Physical design inputs","Floorplanning uses netlist, macro abstracts, technology LEF, timing libraries, constraints and die/core dimensions."],["OpenROAD installation","Follow OpenROAD project documentation for your OS/build; confirm openroad -version after install."]],"lab":"Construct a toy LFSR/MISR example and identify an ATPG stuck-at fault, then verify an OpenROAD installation.","assignment":[{"q":"To detect a stuck-at-1 on a logic node, what must a test pattern establish internally?","options":["Remove every scan cell","Set the good value to 1 exclusively","Disable all outputs","Set the good-circuit value to 0 and observe the resulting difference"],"answer":3,"why":"The fault must be activated by opposing the stuck value."},{"q":"A fault is activated but cannot be observed at any output. What remains missing?","options":["Fault-effect propagation to an observable point","The original RTL source comment","A PDK filename","A lower simulation timestep"],"answer":0,"why":"Detectability requires both activation and propagation."},{"q":"Why might BIST use a pseudo-random pattern generator?","options":["It guarantees 100% coverage of every fault","It replaces all functional logic","It can generate test stimuli on-chip without large external pattern storage","It manufactures a mask set"],"answer":2,"why":"LFSRs provide compact on-chip pattern generation."},{"q":"What is aliasing in signature analysis?","options":["Different output sequences yield the same compressed signature","A clock has two phases","One gate drives two nets","Two library cells have equal height"],"answer":0,"why":"Signature compression may collide for distinct response streams."},{"q":"An LFSR has all zero bits and uses a typical XOR feedback polynomial. What problem can arise?","options":["It cannot be simulated","It may stay locked in the zero state","It will always generate all nonzero sequences","It functions as a counter with no clock"],"answer":1,"why":"Many XOR-based LFSRs have a zero lock-up state."},{"q":"A macro is placed before standard-cell placement. Why?","options":["Macros always have zero area","Macros can be freely cut in two","Macros strongly constrain space, routing channels and pin access","The tool must first generate signoff SDF"],"answer":2,"why":"Large fixed blocks define much of the floorplan."},{"q":"What is the purpose of the LEF macro abstract?","options":["Provide an RTL functional testbench","Store NPTEL exam answers","Represent boundary, pins, obstructions and physical geometry for P&R","Store transistor SPICE equations for every flop only"],"answer":2,"why":"LEF abstracts expose geometry and placement/routing information."},{"q":"What does a soft routing blockage generally discourage?","options":["Formal equivalence checks","Clock period declaration","Routing use in a defined region","Simulation with unknown values"],"answer":2,"why":"Blockages help manage where wires may be routed."},{"q":"A metal macro has power pins but no nearby power straps. Which issue is likely?","options":["Poor power connectivity and IR-drop risk","An improved setup margin by definition","A lower DRC count automatically","Unconditional functional equivalence"],"answer":0,"why":"Power delivery requires appropriate straps and vias."},{"q":"Why review OpenROAD installation and library integration together?","options":["The library is generated by watching a video","OpenROAD can route without any technology files","Physical tools need technology, LEF, Liberty and design-specific configuration","The compiler automatically creates foundry masks"],"answer":2,"why":"Physical flows rely on coherent technology and cell libraries."}],"quiz":[{"q":"In ATPG, what must a test vector do to detect a stuck-at fault?","options":["Activate the fault and propagate its effect to an observable point","Only minimize RTL line count","Change the package footprint","Run the physical router"],"answer":0,"why":"Fault activation and propagation are both necessary for detection."},{"q":"A stuck-at-0 model means what?","options":["A modeled signal is permanently at logic 0","All clocks are disabled","The design contains no flops","The entire chip has no supply voltage"],"answer":0,"why":"Stuck-at fault models fix a net to one logic state."},{"q":"What is a typical objective of BIST?","options":["Remove all test coverage requirements","Generate and analyze test patterns on chip","Convert FPGA into a PCB","Replace entire mask fabrication"],"answer":1,"why":"BIST integrates parts of test equipment into the design."},{"q":"What is an LFSR used for in many BIST architectures?","options":["Pseudo-random pattern generation","Metal fill insertion","Dicing wafer dies","Delivering core VDD"],"answer":0,"why":"LFSRs efficiently produce deterministic pseudo-random sequences."},{"q":"What is a MISR used for?","options":["Compacting multi-bit test responses into a signature","Declaring Verilog parameters","Creating floorplan rows","Scheduling C code operations"],"answer":0,"why":"MISR signatures summarize output streams for comparison."},{"q":"What does fault coverage approximately measure?","options":["Number of source files compiled","Metal utilization divided by die area","Clock frequency divided by voltage","Detected modeled faults divided by total modeled faults"],"answer":3,"why":"Coverage is specific to modeled faults and tool assumptions."},{"q":"What is a major input to physical floorplanning?","options":["Only the testbench VCD","Only algorithm pseudocode","Mapped netlist and physical cell abstracts","Only an oscilloscope photo"],"answer":2,"why":"Placement requires physical and logical description of design objects."},{"q":"What are LEF abstracts useful for?","options":["Cell/macro size, pins, obstructions and routing layers","PCB BOM costing only","Timing waveform traces only","Source-code assertions"],"answer":0,"why":"LEF describes the physical interface without full transistor geometry."},{"q":"What does a routing blockage represent?","options":["A region/layer where routing is restricted","A SAT solver result","A failing Verilog assertion","A library function name"],"answer":0,"why":"Blockages protect macros, keepouts or prohibited routes."},{"q":"Which open-source physical design tool is installed in the Week 10 tutorial?","options":["OpenROAD","Icarus only","GTKWave only","Bambu only"],"answer":0,"why":"OpenROAD implements automated RTL-to-GDS physical flows."}],"resources":[["Day 07 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2007%20-%20Power%20Scan%20Design%20and%20ATPG.pdf"],["Day 07 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2007.md"],["Day 08 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2008%20-%20BIST%20Physical%20Foundations%20and%20Chip%20Planning.pdf"],["Day 08 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2008.md"]]},{"number":11,"title":"Floorplanning & placement","videos":[{"id":47,"title":"Chip Planning - I","youtube":"37Hf_q6IhAs","duration":"60:43","tutorial":false},{"id":48,"title":"Chip Planning - II","youtube":"H2UHFlFTUoo","duration":"51:33","tutorial":false},{"id":49,"title":"Placement","youtube":"-M6o03yNb78","duration":"43:19","tutorial":false},{"id":50,"title":"Chip Planning and Placement","youtube":"NWgkBBXXFKg","duration":"12:24","tutorial":true}],"notes":[["Chip planning","Specify die, core, margins, row/site grids, blockages, macro locations, power distribution and pin placement."],["Utilization","Cell utilization = placed standard-cell area / available placeable core area. High values increase congestion risk."],["Macro placement","Large SRAM/IP macros constrain routing channels and local congestion; consider pin access and keepouts."],["Power grid","Rings/straps/rails distribute VDD/GND; check IR drop and electromigration risk at signoff."],["Global placement","Spreads cells to minimize estimated wirelength and congestion before legalizing placement."],["Detailed placement","Legalizes sites and resolves overlaps while minimizing displacement and optimizing local quality."],["Quality metrics","Inspect congestion, wirelength, density, setup/hold timing and violations after placement."]],"lab":"Sketch die/core, macros, pins, PDN and placement rows; compare utilization/congestion after placement.","assignment":[{"q":"A core has 1 mm² area and standard cells occupy 0.7 mm². What is utilization?","options":["7%","70%","143%","30%"],"answer":1,"why":"Utilization = occupied standard-cell area divided by placeable core area."},{"q":"Why can a near-100% utilized core be hard to route?","options":["Insufficient whitespace for routing, buffering and legalization","A high utilization removes every net","Macros shrink when placed","Metal capacitance becomes zero"],"answer":0,"why":"Physical flows need whitespace and routing resources."},{"q":"What problem is a placement halo around SRAM intended to reduce?","options":["RTL unknown values","Wafer probe time","Cell crowding and pin-access congestion beside the macro","DFT scan length at synthesis"],"answer":2,"why":"Keepouts reserve space around large hard macros."},{"q":"What is a power grid's primary job?","options":["Replace the logical clock","Deliver stable VDD/GND current across the die","Prove gate-level equivalence","Encode test questions in metal"],"answer":1,"why":"PDN metal distributes supply current to cells and macros."},{"q":"A distant region shows supply sag when switching current increases. What is the effect called?","options":["Setup slack","IR drop","Lithography focus depth","Scan hold"],"answer":1,"why":"Resistance in the supply network causes voltage loss under current."},{"q":"Which feature is characteristic of legal placement?","options":["All cells are allowed anywhere on macro pins","Every clock tree has identical length","Routing is already signoff-complete","Cells occupy valid sites without forbidden overlaps"],"answer":3,"why":"Legalization enforces placement and overlap constraints."},{"q":"Global placement optimizes a continuous approximation before detailed legalization. What is a typical objective?","options":["Wafer package cost only","Wirelength, density and timing estimates","Photomask coloring alone","Final LVS netlist extraction"],"answer":1,"why":"Global placement balances approximate placement quality metrics."},{"q":"A floorplan repeatedly congests beside a large macro. What change may help?","options":["Remove every pin from the macro abstract","Move/rotate the macro or reserve a wider channel","Force all standard cells into the channel","Delete timing constraints"],"answer":1,"why":"Better macro planning can improve accessibility and routing demand."},{"q":"Why is aspect ratio a floorplanning parameter?","options":["It defines Verilog bit width","It influences die geometry and routing distances","It changes the logical truth table","It guarantees minimum dynamic power"],"answer":1,"why":"Core shape affects connectivity and placement opportunities."},{"q":"A placed design has many overlapping cells. What step addresses overlaps while preserving site legality?","options":["Parasitic extraction","Legalization","GDS streamout alone","Scan fault simulation"],"answer":1,"why":"Legalization relocates instances to valid nonoverlapping sites."}],"quiz":[{"q":"What is the chip core?","options":["Always exactly the die outline","A scan-pattern file","Only the silicon ingot","Region intended for standard cells and internal resources"],"answer":3,"why":"The core is a placed region within the die that typically leaves margins for I/O/power."},{"q":"What does standard-cell utilization mean?","options":["Core supply divided by leakage current","Placed cell area divided by available placeable area","Clock period divided by routing layers","Number of cells divided by transistor count"],"answer":1,"why":"High utilization tends to leave less whitespace for routing and optimization."},{"q":"Why does overly high utilization often cause trouble?","options":["Congestion, poor routability and timing repair difficulty","It removes the need for CTS","It guarantees DRC-clean wiring","It eliminates wire capacitance"],"answer":0,"why":"Dense placements reduce routing space and room for buffers."},{"q":"Why are macro keepouts used?","options":["Reserve space near macros for placement/routing access","Make clocks zero-skew","Convert RTL directly to GDS","Disable all memories"],"answer":0,"why":"Keepouts reduce crowding around difficult macro boundaries."},{"q":"What is the purpose of a power distribution network?","options":["Encode FSM states","Calculate BDD sizes","Deliver stable VDD and GND throughout the chip","Run Verilog simulation"],"answer":2,"why":"PDN straps/rails distribute power and return current."},{"q":"What does IR drop refer to?","options":["An instruction register bit","An FPGA block RAM","A scan shift pattern","Supply voltage loss through resistive distribution"],"answer":3,"why":"Current through finite PDN resistance causes voltage drop."},{"q":"What does global placement optimize?","options":["Test coverage percentage only","Final manufacturing masks only","Clock edges in a VCD only","Approximate cell positions for wirelength/density and congestion"],"answer":3,"why":"Global placement balances wirelength and density before exact legalization."},{"q":"What is legalization in detailed placement?","options":["Change module ports to analog","Convert GDS to netlist","Mask OPC correction","Move cells onto legal sites without overlaps"],"answer":3,"why":"Standard cells must occupy valid site/row locations."},{"q":"Which metric can indicate a difficult-to-route floorplan?","options":["Longer module identifier names","High routing congestion","A higher version number of Tcl","Fewer text comments"],"answer":1,"why":"Congestion estimates resource demand relative to available routing tracks."},{"q":"What is a placement blockage?","options":["An unavailable license for iverilog","A region where certain cells should not be placed","A timing constraint exception","An unreachable testbench path"],"answer":1,"why":"Placement restrictions guide core layout and protect reserved areas."}],"resources":[["Day 08 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2008%20-%20BIST%20Physical%20Foundations%20and%20Chip%20Planning.pdf"],["Day 08 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2008.md"],["Day 09 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2009%20-%20Placement%20Clocks%20Routing%20and%20Signoff.pdf"],["Day 09 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2009.md"]]},{"number":12,"title":"CTS, routing & signoff","videos":[{"id":51,"title":"Clock Tree Synthesis (CTS)","youtube":"BQHczZr4ONA","duration":"48:28","tutorial":false},{"id":52,"title":"Routing","youtube":"nsYhC5btQko","duration":"64:43","tutorial":false},{"id":53,"title":"Post-layout Verification and Signoff","youtube":"EKt-Ev3c_bE","duration":"44:30","tutorial":false},{"id":54,"title":"Clock Tree Synthesis (CTS) and Routing","youtube":"78O_COvyqAw","duration":"13:32","tutorial":true}],"notes":[["Clock tree synthesis","Constructs a buffered clock network that limits insertion delay, skew and slew across clock sinks."],["Skew effects","Positive capture skew can help setup but hurt hold; CTS must balance both constraints."],["Routing","Global routing allocates routing resources; detailed routing assigns exact wires/vias under design rules."],["Parasitic extraction","Real wires introduce resistance and capacitance; extracted parasitics update path delay estimates."],["Physical signoff","DRC checks geometry rules; LVS compares layout-extracted connections to the intended netlist."],["Timing signoff","Verify worst-case setup/hold with extracted RC, corners, derates, and clean constraints."],["GDS output","GDSII (or OASIS) stores mask-level geometry; signoff and foundry handoff determine tape-out readiness."]],"lab":"Identify CTS buffers, routed wires, extracted parasitics and the separate roles of DRC, LVS, timing signoff and GDS export.","assignment":[{"q":"A clock tree has large variation in register clock arrival. Which goal of CTS is not being met?","options":["Combinational equivalence","Package pin mapping","Controlled skew","DRC via count only"],"answer":2,"why":"CTS seeks acceptable distribution delay and skew."},{"q":"For setup analysis, capture-clock arrival later than launch can have which effect, all else equal?","options":["It never changes timing","It may relax setup but tighten hold","It always worsens both setup and hold","It removes the need for clock period"],"answer":1,"why":"Useful skew trades setup and hold timing margins."},{"q":"Global routing assigns paths to which abstraction?","options":["Verilog procedural blocks","BIST fault signatures","Final transistor geometry masks","Coarse routing regions and estimated wire resources"],"answer":3,"why":"Global routing plans approximate net corridors and resource use."},{"q":"Detailed routing decides what?","options":["Exact tracks, wires and vias meeting design rules","The high-level algorithm","FSM state encoding only","Scan compression polynomial only"],"answer":0,"why":"Detailed route creates manufacturable geometric paths."},{"q":"A long routed wire has large RC. Which symptom is likely?","options":["Reduced capacitance by definition","Automatic elimination of setup checks","Zero coupling noise","Extra delay and degraded signal transitions"],"answer":3,"why":"Parasitic resistance and capacitance influence delay and slew."},{"q":"What does parasitic extraction provide for post-route timing?","options":["Wafer probe defect map","The correct software compiler version","Behavioral RTL source code","Interconnect R and C models"],"answer":3,"why":"Extracted wiring parasitics refine actual delay calculation."},{"q":"After a route fix, DRC reports metal shorts but LVS passes on an older layout snapshot. What should be done?","options":["Rerun signoff checks on the same final layout revision","Tape out based on the older LVS","Delete the DRC report","Assume the route fix is always safe"],"answer":0,"why":"All signoff reports must correspond to the final artifact."},{"q":"How does antenna checking differ from ordinary functional logic testing?","options":["It compiles the netlist into software","It addresses manufacturing charge-damage risks on connected gates","It verifies all state machine transitions","It measures algorithm throughput"],"answer":1,"why":"Antenna rules mitigate charge accumulation during fabrication."},{"q":"What is an engineering change order (ECO) in physical design?","options":["A scan clock definition only","A wafer purchase invoice","A standard-cell Boolean gate type","A late targeted netlist or layout modification to fix a remaining issue"],"answer":3,"why":"ECO changes aim to close selected implementation issues late in the flow."},{"q":"Which set most closely represents complete signoff readiness?","options":["A visually attractive floorplan","RTL compilation only","A high placement utilization number","Clean STA, physical verification, power integrity and final layout checks"],"answer":3,"why":"Tape-out requires coordinated timing, geometry, connectivity and integrity validation."}],"quiz":[{"q":"What is the central objective of CTS?","options":["Distribute a clock with acceptable skew, latency and slew","Delete all sequential logic","Perform full-chip DRC only","Write a testbench for ATPG"],"answer":0,"why":"CTS builds/optimizes the clock network between clock source and sinks."},{"q":"Which effect can positive capture-clock skew often have?","options":["Always help both setup and hold","Only affect wire color","Completely eliminate uncertainty","Help setup but potentially hurt hold"],"answer":3,"why":"Later capture clock gives more setup time but may tighten hold requirements."},{"q":"What is global routing?","options":["Estimate paths/allocate routing resources without assigning final exact geometry","Flatten a PDF","Fabricate all vias in a foundry","Simulate every RTL vector"],"answer":0,"why":"Global routing plans coarse routes that detailed routing finalizes."},{"q":"What does detailed routing produce?","options":["Verilog reg assignments","Exact legal wires and vias","Only testbench stimulus","CPU assembly instructions"],"answer":1,"why":"Detailed routing must satisfy layer/via and spacing rules."},{"q":"Which parasitics have strong effects on routed signal delay?","options":["Tcl variable names","Comment indentation and whitespace","Number of Git commits","Resistance and capacitance"],"answer":3,"why":"Interconnect R/C introduces propagation delay and slew changes."},{"q":"What does DRC check?","options":["The professor's weekly schedule","RTL functional equivalence only","On-chip test stimulus compression only","Physical geometry against foundry rules"],"answer":3,"why":"DRC verifies layout geometry constraints."},{"q":"What does LVS check?","options":["Tcl loop count","Layout-extracted circuitry against a reference netlist","Waveform pixel quality","Only power switching activity"],"answer":1,"why":"Layout Versus Schematic checks connectivity/electrical consistency."},{"q":"Why perform post-route STA?","options":["To change the RTL language","Extracted interconnect delays change path timing","Because cell libraries become unnecessary","Because all timing violations vanish after routing"],"answer":1,"why":"Post-route timing uses more accurate routed RC and clock delays."},{"q":"What is a GDSII file typically used for?","options":["Simulation log text","Hierarchical mask layout geometry","Source control merge history","A scan chain vector list"],"answer":1,"why":"GDSII is a layout exchange format used for fabrication handoff."},{"q":"Which combination most directly supports responsible tape-out signoff?","options":["Clean DRC/LVS and validated timing across required corners","All videos marked complete only","One successful RTL simulation without constraints","A working syntax highlighter only"],"answer":0,"why":"Physical and timing verification must be satisfied before manufacturing release."}],"resources":[["Day 09 detailed PDF","https://github.com/kapiltrip/RTL-to-GDS-Flow/raw/refs/heads/main/PDFs/Day%2009%20-%20Placement%20Clocks%20Routing%20and%20Signoff.pdf"],["Day 09 notes (.md)","https://github.com/kapiltrip/RTL-to-GDS-Flow/blob/main/Resources/Daily%20Notes/Day%2009.md"]]}]},{"id":"dic","code":"108106158","name":"Digital IC Design","short":"Digital IC","prof":"Prof. Janakiraman Viraraghavan","inst":"IIT Madras","intro":"UuafwIJAKhY","assignmentNote":"Practice set written for this week's lectures — not the official graded questions.","assignmentLink":null,"links":[["NPTEL course page","https://nptel.ac.in/courses/108106158"],["Downloads & transcripts","https://archive.nptel.ac.in/courses/108106158"],["Syllabus PDF","https://archive.nptel.ac.in/content/syllabus_pdf/108106158.pdf"],["YouTube playlist","https://www.youtube.com/playlist?list=PLyqSpQzTE6M-ceKpZZSTa0uNOuCjSubd2"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"],["Live sessions (TA playlist)","https://www.youtube.com/playlist?list=PL02I3BVihuZvtBIzHI54hS1mTMZtVnj8y"]],"weeks":[{"number":1,"title":"MOSFET fundamentals","videos":[{"id":1,"title":"Introduction - Digital IC Design","youtube":"g6CCJAbdkK8","duration":"29:03","tutorial":false},{"id":2,"title":"Transistor 1 - PN Junction","youtube":"57uTCtSQV50","duration":"19:45","tutorial":false},{"id":3,"title":"Transistor 2 - MOS Capacitor Threshold Voltage","youtube":"ecKM_KwQpjE","duration":"29:01","tutorial":false},{"id":4,"title":"Transistor 3 - MOS Transistor Current Expression","youtube":"XbqLpBjOYDA","duration":"17:13","tutorial":false},{"id":5,"title":"Transistor 4 - Body Effect and I-V Plots","youtube":"LC1c1ciOrA8","duration":"25:30","tutorial":false},{"id":6,"title":"Transistor 5 - Short Channel Transistors: Channel Length Modulation","youtube":"vd_g8l0DycU","duration":"18:52","tutorial":false},{"id":7,"title":"Transistor 6 - Velocity Saturation and Level-1 SPICE Model","youtube":"Ibx8omaD8c0","duration":"31:38","tutorial":false}],"notes":[["PN junction","Diffusion leaves a depletion region with a built-in potential φ0 = (kT/q)·ln(NA·ND/ni²). Reverse bias widens the depletion region; forward bias narrows it."],["MOS capacitor","For an NMOS (p-body), raising VGS moves the surface through accumulation → depletion → inversion. VT is the gate voltage where the surface potential reaches 2φF (strong inversion)."],["Long-channel I–V","Linear: ID = k'(W/L)[(VGS−VT)VDS − VDS²/2]. Saturation (VDS ≥ VGS−VT): ID = ½k'(W/L)(VGS−VT)². Square law."],["Body effect","VT = VT0 + γ(√(2φF+VSB) − √(2φF)). Reverse-biasing source-to-body (VSB > 0) raises VT — this matters for stacked transistors."],["Channel-length modulation","In saturation the pinch-off point moves toward the source as VDS rises: ID ≈ ID,sat(1+λVDS). λ grows as L shrinks → finite output resistance."],["Velocity saturation","At high lateral field carrier velocity saturates, so saturation current becomes roughly linear in (VGS−VT). The unified model uses VDS,eff = min(VGS−VT, VDS, VDSAT)."]],"lab":"ngspice: sweep VGS and VDS for an NMOS (Level-1) and plot ID; read off VT, λ and the linear/saturation boundary.","assignment":[{"q":"As VGS of an NMOS on p-substrate rises from strongly negative to above VT, the surface goes through:","options":["Accumulation → inversion → depletion","Depletion → accumulation → inversion","Inversion → depletion → accumulation","Accumulation → depletion → inversion"],"answer":3,"why":"Negative gate attracts holes (accumulation), then repels them (depletion), then attracts electrons (inversion)."},{"q":"A long-channel NMOS is in saturation when:","options":["VDS ≥ VT","VGS < VT","VDS ≤ VGS − VT","VDS ≥ VGS − VT"],"answer":3,"why":"The channel pinches off at the drain once VDS reaches the overdrive VGS − VT."},{"q":"Long-channel NMOS, k'(W/L) = 200 µA/V², VT = 0.5 V, VGS = 1.5 V, in saturation (λ = 0). ID = ?","options":["200 µA","400 µA","100 µA","50 µA"],"answer":2,"why":"ID = ½·200µ·(1.0)² = 100 µA."},{"q":"For a long-channel device in saturation, doubling (VGS − VT) changes ID by:","options":["×√2","×8","×4","×2"],"answer":2,"why":"Square law: ID ∝ (VGS − VT)²."},{"q":"Increasing the source-to-body reverse bias VSB of an NMOS:","options":["Turns the device into depletion mode","Leaves VT unchanged","Increases VT","Decreases VT"],"answer":2,"why":"Body effect: VT = VT0 + γ(√(2φF+VSB) − √(2φF))."},{"q":"Channel-length modulation shows up as:","options":["ID falling with VDS in saturation","Gate current increasing with VDS","ID rising slowly with VDS in saturation","VT rising with VDS"],"answer":2,"why":"The effective channel shortens as VDS grows: ID ≈ ID,sat(1 + λVDS)."},{"q":"In a strongly velocity-saturated device, the saturation current depends on (VGS − VT) roughly:","options":["Linearly","Quadratically","Exponentially","Not at all"],"answer":0,"why":"Carriers move at vsat, so current ∝ charge ∝ overdrive."},{"q":"Reverse-biasing a PN junction:","options":["Narrows the depletion region","Removes the depletion region","Lowers the built-in barrier","Widens the depletion region"],"answer":3,"why":"The applied reverse voltage adds to the built-in potential, uncovering more fixed charge."},{"q":"Threshold (strong inversion) is reached when the surface potential equals:","options":["φF","φF/2","VDD/2","2φF"],"answer":3,"why":"Strong inversion: electron density at the surface equals the hole density in the bulk → ψs = 2φF."},{"q":"In the deep linear region (very small VDS) a MOSFET acts like:","options":["A resistor ≈ 1/[k'(W/L)(VGS − VT)]","A constant current source","An open circuit","A forward-biased diode"],"answer":0,"why":"With VDS² negligible, ID ≈ k'(W/L)(VGS − VT)·VDS — linear in VDS."}],"solution":{"youtube":"Hg9g2mwX1TA","duration":"05:10"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":2,"title":"Short-channel effects, leakage & capacitance","videos":[{"id":8,"title":"Transistor 7 - Drain Induced Barrier Lowering","youtube":"O43dSdxcE0c","duration":"15:37","tutorial":false},{"id":9,"title":"Transistor 8 - Sub-Threshold Leakage","youtube":"h0DEBSVzMLo","duration":"19:08","tutorial":false},{"id":10,"title":"Transistor 9 - Substrate and Gate Leakage","youtube":"qCeXMi2p3QI","duration":"19:14","tutorial":false},{"id":11,"title":"Transistor 10 - The PMOS Transistor","youtube":"SY44Z3eJpOg","duration":"30:34","tutorial":false},{"id":12,"title":"Transistor 11 - Transistor Capacitance 1","youtube":"WNtozE2CwVM","duration":"22:16","tutorial":false},{"id":13,"title":"Transistor 12 - Transistor Capacitance 2","youtube":"t9h5mPWNtq0","duration":"27:02","tutorial":false}],"notes":[["DIBL","In short channels a large VDS lowers the source–channel barrier, reducing VT: VT ≈ VT0 − ηVDS. Off-current rises with supply voltage."],["Subthreshold conduction","ID ∝ e^{(VGS−VT)/(n·kT/q)}. Swing S = n·(kT/q)·ln10 ≈ n·60 mV/decade at 300 K. Every S millivolts of VT reduction costs 10× leakage."],["Other leakage","Gate leakage: tunnelling through thin oxide. Junction/substrate leakage: reverse-biased drain–body diodes (plus GIDL/band-to-band). Leakage rises strongly with temperature."],["PMOS","Conducts holes; on when VGS < VTp (negative). Hole mobility is ~2–3× lower, so a PMOS is made ~2× wider for the same drive."],["Gate capacitance","Total ≈ Cox·W·L. Cutoff: mostly to body. Linear: split ~½/½ between Cgs and Cgd. Saturation: ~⅔ to Cgs, Cgd ≈ overlap only."],["Diffusion capacitance","Drain/source junctions add area + sidewall capacitance; it decreases with reverse bias. Rule of thumb: diffusion cap ≈ gate cap per unit width — the source of parasitic delay."]],"lab":"ngspice: plot log(ID) vs VGS below threshold; measure subthreshold swing (mV/decade) and how VT shifts with VDS (DIBL).","assignment":[{"q":"DIBL causes the threshold voltage to:","options":["Depend only on VSB","Increase with channel length only","Decrease as VDS increases","Increase as VDS increases"],"answer":2,"why":"A high drain voltage lowers the source barrier, so VT ≈ VT0 − ηVDS."},{"q":"The ideal subthreshold swing at room temperature is about:","options":["6 mV/decade","26 mV/decade","60 mV/decade","600 mV/decade"],"answer":2,"why":"S = n·(kT/q)·ln10 ≈ 2.3 × 26 mV ≈ 60 mV/dec for n = 1."},{"q":"With S = 90 mV/decade, lowering VT by 180 mV increases subthreshold leakage by:","options":["1000×","100×","10×","2×"],"answer":1,"why":"180/90 = 2 decades → 10² = 100×."},{"q":"Subthreshold leakage when temperature rises:","options":["Decreases","Increases","Stays constant","Becomes zero"],"answer":1,"why":"kT/q grows and VT drops with temperature — both raise the off current."},{"q":"Gate leakage in thin-oxide devices is mainly due to:","options":["Velocity saturation","Channel-length modulation","Quantum tunnelling through the oxide","Hot-electron injection only"],"answer":2,"why":"Electrons tunnel directly through a few-nanometre oxide."},{"q":"PMOS devices are usually made wider than NMOS because:","options":["PMOS has no body effect","Hole mobility is lower than electron mobility","PMOS has a lower |VT|","Holes move faster"],"answer":1,"why":"μp ≈ μn/2–μn/3, so wider W compensates for equal drive."},{"q":"In saturation, the intrinsic gate-channel capacitance appears mostly as:","options":["Split equally Cgs/Cgd","Cgd (about ⅔ CoxWL)","Cgs (about ⅔ CoxWL)","Cgb"],"answer":2,"why":"The channel is pinched off at the drain, so it couples mainly to the source."},{"q":"Junction (diffusion) capacitance under larger reverse bias:","options":["Stays constant","Decreases","Increases","Becomes negative"],"answer":1,"why":"A wider depletion region means a smaller capacitance."},{"q":"Doubling the width of an NMOS (same L) roughly:","options":["Halves current, doubles gate cap","Doubles both drive current and gate capacitance","Doubles current, halves gate cap","Changes neither"],"answer":1,"why":"Both ID and Cg scale with W."},{"q":"Off-state leakage of a short-channel NMOS grows with VDD mainly because of:","options":["Mobility degradation","DIBL","Body effect","Velocity saturation"],"answer":1,"why":"Higher VDS lowers VT, exponentially increasing subthreshold current."}],"solution":{"youtube":"2BCuPuHdz0E","duration":"06:21"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":3,"title":"CMOS inverter: VTC & trip point","videos":[{"id":14,"title":"Inverter 1 - CMOS Inverter Construction","youtube":"tRakiNOYBxI","duration":"24:21","tutorial":false},{"id":15,"title":"Inverter 2 - Voltage Transfer Characteristics","youtube":"Ta5kRCSR_Yk","duration":"20:16","tutorial":false},{"id":16,"title":"Inverter 3 - Load Line Analysis","youtube":"QnjZQHB1hR0","duration":"30:06","tutorial":false},{"id":17,"title":"Inverter 4 - Trip Point for Short Channel Device Inverter","youtube":"lE3KY0PLR08","duration":"27:42","tutorial":false},{"id":18,"title":"Inverter 5 - Trip Point for Long Channel Device Inverter","youtube":"X8l2e3nF_ls","duration":"13:11","tutorial":false},{"id":19,"title":"Inverter 6 - Noise Margin Analysis 1","youtube":"EiuvIRhT2wA","duration":"17:05","tutorial":false},{"id":20,"title":"Inverter 7 - Noise Margin Analysis 2","youtube":"IT9Fj1y6te8","duration":"18:32","tutorial":false}],"notes":[["Construction","PMOS pull-up to VDD, NMOS pull-down to GND. Exactly one network conducts in steady state → rail-to-rail output (VOH = VDD, VOL = 0) and ~zero static power."],["VTC regions","As Vin rises: NMOS goes off → saturation → linear, PMOS goes linear → saturation → off. Both are saturated around the switching point, where gain is highest."],["Load-line analysis","For each Vin overlay IDn(Vout) and |IDp|(Vout); the intersection (IDn = |IDp|) gives Vout. Sweeping Vin traces the VTC."],["Trip point (long channel)","VM = (VTn + r(VDD−|VTp|)) / (1+r), r = √(kp/kn). With kp = kn and VTn = |VTp|, VM = VDD/2."],["Trip point (short channel)","With velocity saturation the current is ~linear in overdrive, so r ≈ (vsat,p·Wp)/(vsat,n·Wn). Either way, a stronger PMOS pushes VM toward VDD."],["Sizing for symmetry","Since μn ≈ 2μp, Wp/Wn ≈ 2 gives a near-symmetric VTC and roughly equal rise/fall drive."]],"lab":"Simulate a CMOS inverter VTC (DC sweep). Change Wp/Wn from 1 to 4 and record how VM moves.","assignment":[{"q":"The static power of an ideal CMOS inverter in steady state is:","options":["≈ 0 (leakage only)","CL·VDD²·f","VDD²/Ron","Equal to its dynamic power"],"answer":0,"why":"One network is always off, so no DC path from VDD to GND."},{"q":"At Vin = VM of a symmetric CMOS inverter, the transistors are:","options":["NMOS linear, PMOS saturation","Both in saturation","Both off","Both in linear"],"answer":1,"why":"At the switching point both have large VDS relative to overdrive."},{"q":"Making the PMOS wider moves the trip point VM:","options":["Below VTn","Nowhere","Toward 0 V","Toward VDD"],"answer":3,"why":"A stronger pull-up needs a higher Vin before the NMOS can win."},{"q":"Long-channel inverter, VDD = 1.2 V, VTn = |VTp| = 0.4 V, kn = kp. VM = ?","options":["0.6 V","0.4 V","0.8 V","0.533 V"],"answer":0,"why":"Symmetric devices → VM = VDD/2."},{"q":"Same inverter but kp = kn/4 (r = √(kp/kn) = 0.5). VM = ?","options":["0.667 V","0.4 V","0.6 V","≈ 0.533 V"],"answer":3,"why":"VM = (0.4 + 0.5·0.8)/(1 + 0.5) = 0.8/1.5 ≈ 0.533 V."},{"q":"In load-line analysis, Vout for a given Vin is where:","options":["Both devices are off","IDn = |IDp|","VDSn = VGSn","IDn = 0"],"answer":1,"why":"In steady state the same current must flow through both devices."},{"q":"VOH and VOL of a static CMOS inverter are:","options":["VDD and 0","VDD/2 and 0","VDD − VT and VT","VDD and VTn"],"answer":0,"why":"Full rail-to-rail swing: the off network can't fight the on one."},{"q":"When Vin is just above VTn, the transistors are:","options":["Both saturation","Both linear","NMOS linear, PMOS saturation","NMOS saturation, PMOS linear"],"answer":3,"why":"Vout ≈ VDD, so the NMOS has large VDS (sat) and the PMOS small |VDS| (linear)."},{"q":"The magnitude of the inverter voltage gain is largest:","options":["At Vin = VDD","Near the switching threshold VM","At Vin = 0","Equal everywhere"],"answer":1,"why":"Both devices are saturated around VM, giving the steepest VTC."},{"q":"With μn ≈ 2μp and |VT| equal, VM = VDD/2 needs Wp/Wn of about:","options":["2","1","4","0.5"],"answer":0,"why":"Matching kp = kn requires Wp/Wn = μn/μp ≈ 2."}],"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":4,"title":"Noise margins, pass gates & RC delay","videos":[{"id":21,"title":"Inverter 8 - Noise Margin Analysis 3","youtube":"1a0VVkI1mUw","duration":"18:09","tutorial":false},{"id":22,"title":"Inverter 9 - Noise Margin: Long Channel Device Inverter 1","youtube":"37ny5i1QvXs","duration":"31:22","tutorial":false},{"id":23,"title":"Inverter 10 - Noise Margin: Long Channel Device Inverter 2","youtube":"j7IOY_LZ4eA","duration":"11:45","tutorial":false},{"id":24,"title":"Inverter 11 - Pass Transistors","youtube":"SaU70OsGLbQ","duration":"09:39","tutorial":false},{"id":25,"title":"Inverter 12 - NMOS ON Resistance and Fall Delay","youtube":"e752bpyMCkM","duration":"22:03","tutorial":false},{"id":26,"title":"Inverter 13 - Elmore Delay Model","youtube":"BIXuGEzHJsM","duration":"31:56","tutorial":false}],"notes":[["Noise margins","VIL and VIH are where dVout/dVin = −1. NML = VIL − VOL, NMH = VOH − VIH."],["Symmetric long-channel inverter","With kn = kp and VTn = |VTp| = VT: VIL = (3VDD + 2VT)/8 and VIH = (5VDD − 2VT)/8, so NML = NMH."],["Pass transistors","An NMOS passes a strong 0 but a weak 1 (max ≈ VDD − VTn, worse with body effect). A PMOS passes a strong 1 and weak 0. A transmission gate passes both."],["Switch model","Replace the on transistor with Ron ∝ L/W. Single RC discharge: 50% delay = ln2·RC ≈ 0.69·RC."],["Elmore delay","For an RC tree, τ = Σ Ci · R(shared path from source to node i and to the output). For a ladder R1–C1–R2–C2: τ = R1C1 + (R1+R2)C2."],["Scaling intuition","Doubling W halves Ron (and doubles its own gate/diffusion cap) — sizing trades drive strength against load presented to the previous stage."]],"lab":"From the VTC derivative find VIL/VIH (slope = −1) and compute NML/NMH. Hand-calc an Elmore delay for a 3-node RC ladder.","assignment":[{"q":"NML is defined as:","options":["VDD − VM","VIL − VOL","VIH − VIL","VOH − VIH"],"answer":1,"why":"How much a low output can rise before the next gate stops reading it as low."},{"q":"Symmetric long-channel inverter, VDD = 1.2 V, VT = 0.4 V. VIL = (3VDD + 2VT)/8 = ?","options":["0.65 V","0.45 V","0.60 V","0.55 V"],"answer":3,"why":"(3.6 + 0.8)/8 = 0.55 V."},{"q":"For the same inverter, VIH = (5VDD − 2VT)/8 = ?","options":["0.75 V","0.60 V","0.55 V","0.65 V"],"answer":3,"why":"(6.0 − 0.8)/8 = 0.65 V, so NMH = 1.2 − 0.65 = 0.55 V = NML."},{"q":"VIL and VIH are found where the VTC slope equals:","options":["−∞","−1","+1","0"],"answer":1,"why":"Beyond these points noise is amplified rather than attenuated."},{"q":"An NMOS pass transistor with gate at VDD passing a logic 1 charges the output to about:","options":["0","VDD/2","VDD − VTn (worse with body effect)","VDD"],"answer":2,"why":"The NMOS turns off once VGS falls to VT."},{"q":"Which element passes both a strong 0 and a strong 1?","options":["NMOS pass transistor","PMOS pass transistor","Transmission gate","Pseudo-NMOS load"],"answer":2,"why":"NMOS handles the 0, PMOS handles the 1."},{"q":"The 50% propagation delay of a single RC discharge is:","options":["0.5·RC","0.69·RC","2.2·RC","RC"],"answer":1,"why":"Vout = VDD·e^{−t/RC} reaches VDD/2 at t = ln2·RC."},{"q":"Doubling the NMOS width (fixed external load, ignoring self-loading) changes the fall delay by:","options":["No change","≈ 2×","≈ ½","≈ ¼"],"answer":2,"why":"Ron halves."},{"q":"RC ladder: source–R1–node1(C1)–R2–node2(C2), output at node2. Elmore delay =","options":["R1C2 + R2C1","(R1+R2)(C1+C2)","R2C2","R1C1 + (R1+R2)C2"],"answer":3,"why":"Each C times the resistance it shares with the path to the output."},{"q":"With R1 = R2 = 1 kΩ and C1 = C2 = 10 fF, the Elmore delay is:","options":["40 ps","15 ps","30 ps","20 ps"],"answer":2,"why":"1k·10f + 2k·10f = 10 ps + 20 ps."}],"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":5,"title":"Transient response & power","videos":[{"id":27,"title":"Inverter 14 - Transient Response","youtube":"pqoOIfMjoQw","duration":"25:57","tutorial":false},{"id":28,"title":"Inverter 15 - Dynamic Power","youtube":"_P0VKWzTPZ8","duration":"13:05","tutorial":false},{"id":29,"title":"Inverter 16 - Short Circuit Power","youtube":"i1SBiA3c7AQ","duration":"26:28","tutorial":false},{"id":30,"title":"Inverter 17 - Leakage Power and Transistor Stacks","youtube":"602odHNSVNY","duration":"26:04","tutorial":false},{"id":31,"title":"Inverter 18 - Stacking Effect and Sleep Transistors","youtube":"7qU6jRqvrlA","duration":"23:55","tutorial":false},{"id":32,"title":"Inverter 19 - Ring Oscillators and Process Variations","youtube":"V7Tw61cIPPo","duration":"23:16","tutorial":false}],"notes":[["Propagation delay","tpHL ≈ 0.69·Rn·CL, tpLH ≈ 0.69·Rp·CL, tp = (tpHL + tpLH)/2. CL includes the next gate's input cap, wire cap and the driver's own diffusion cap."],["Dynamic power","P = α·CL·VDD²·f. Charging CL draws CL·VDD² from the supply; half is stored, half burnt in the PMOS; discharge burns the stored half in the NMOS."],["Short-circuit power","During slow input transitions both networks conduct briefly. Keeping input slopes comparable to output slopes keeps it to a small fraction of dynamic power."],["Leakage & stacking","Two series off transistors leak far less than one: the middle node rises, giving the top device negative VGS, body effect (higher VT) and lower VDS (less DIBL)."],["Sleep transistors","Power gating: a high-VT header/footer cuts the supply in standby to remove leakage, at the cost of area and some active-mode delay."],["Ring oscillators","An odd number N of inverters oscillates at f = 1/(2·N·tp). Used on-chip to monitor delay and process/voltage/temperature variation."]],"lab":"Simulate a 5-stage ring oscillator; measure frequency, derive tp, and compare across VDD = 0.8/1.0/1.2 V.","assignment":[{"q":"Dynamic switching power is:","options":["α·C·VDD·f²","C·VDD/f","α·C·VDD²·f","½·C·VDD·f"],"answer":2,"why":"Activity × switched capacitance × VDD² × frequency."},{"q":"Scaling VDD from 1.0 V to 0.8 V (same α, C, f) scales dynamic power to:","options":["0.8×","0.64×","0.512×","0.9×"],"answer":1,"why":"(0.8)² = 0.64."},{"q":"Energy drawn from the supply when CL charges from 0 to VDD:","options":["½·CL·VDD²","CL·VDD","CL·VDD²","2·CL·VDD²"],"answer":2,"why":"Q = CL·VDD drawn at VDD; half stored, half dissipated in the PMOS."},{"q":"α = 0.2, C = 10 pF, VDD = 1 V, f = 1 GHz. Dynamic power = ?","options":["10 mW","20 mW","1 mW","2 mW"],"answer":3,"why":"0.2 × 10p × 1 × 1G = 2 mW."},{"q":"A 5-stage ring oscillator with tp = 20 ps per stage oscillates at:","options":["2.5 GHz","50 GHz","10 GHz","5 GHz"],"answer":3,"why":"f = 1/(2·5·20 ps) = 1/200 ps."},{"q":"A ring oscillator needs an odd number of inverters because:","options":["Even rings can't be laid out","An even ring has a stable state and latches","Odd rings use less power","Even rings oscillate too fast"],"answer":1,"why":"An even loop is bistable — no oscillation."},{"q":"A stack of two off NMOS leaks less than one, mainly because:","options":["Total width doubles","The middle node rises → negative VGS, body effect, lower DIBL","The stack is velocity saturated","Gate capacitance is doubled"],"answer":1,"why":"The top device sees VGS < 0, a higher VT and a smaller VDS."},{"q":"Short-circuit power arises when:","options":["The output is held high","Both networks conduct during a slow input transition","Leakage flows through the gate","The load capacitance is zero"],"answer":1,"why":"Between VTn and VDD − |VTp| both devices are on."},{"q":"A sleep transistor for power gating is typically:","options":["A clock buffer","A capacitor on the supply","A low-VT device in parallel with the load","A high-VT header/footer in series with the logic"],"answer":3,"why":"It cuts the supply path in standby, removing leakage."},{"q":"tpHL of an inverter is set mainly by:","options":["Supply ripple","Input capacitance only","NMOS on-resistance and the load capacitance","PMOS width only"],"answer":2,"why":"tpHL ≈ 0.69·Rn·CL."}],"solution":{"youtube":"XMGKZ92qDZg","duration":"09:33"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":6,"title":"Static CMOS gates & sizing","videos":[{"id":33,"title":"CombCkt 1 - Implementing Any Boolean Logic Function","youtube":"BtYCcPuIaxM","duration":"24:48","tutorial":false},{"id":34,"title":"CombCkt 2 - Boolean Functions: Examples, Gate Sizing","youtube":"0RKz3HteOls","duration":"16:14","tutorial":false},{"id":35,"title":"CombCkt 3 - Gate Sizing","youtube":"znuxpaxhUu4","duration":"21:25","tutorial":false},{"id":36,"title":"CombCkt 4 - Logic Gate Capacitance","youtube":"I4Hs4dPvSgY","duration":"25:40","tutorial":false},{"id":37,"title":"CombCkt 5 - Gate Delay","youtube":"PfFGF0vKC1M","duration":"25:34","tutorial":false},{"id":38,"title":"CombCkt 6 - Parasitic Delay","youtube":"rG8wbcy3SeM","duration":"23:32","tutorial":false},{"id":39,"title":"CombCkt 7 - Gate Delay with a Load Capacitance","youtube":"EF2NdYRt29g","duration":"25:09","tutorial":false}],"notes":[["Static CMOS synthesis","Pull-down NMOS network implements the complement of F: series = AND, parallel = OR. Pull-up is the dual. Every static CMOS stage is inverting."],["Unit sizing","Reference inverter: Wn = 1, Wp = 2. Multiply widths by the number of series devices: NAND2 → NMOS 2, PMOS 2; NOR2 → NMOS 1, PMOS 4."],["Input capacitance","Cin = sum of widths on an input: inverter 3, NAND2 4, NOR2 5 (in units of C per unit width)."],["Delay model","d = f + p = g·h + p, in units of τ (delay of an ideal fanout-of-1 inverter without parasitics). h = Cout/Cin is electrical effort."],["Logical effort","g = Cin(gate) / Cin(inverter) for equal drive: inverter 1, NAND2 4/3, NOR2 5/3, NAND-n (n+2)/3, NOR-n (2n+1)/3."],["Parasitic delay","From the gate's own diffusion cap. p_inv ≈ 1, NAND-n ≈ n, NOR-n ≈ n. Example: FO4 inverter delay = 4 + 1 = 5τ."]],"lab":"Draw transistor-level schematics for NAND3, NOR3 and AOI21 with unit-drive sizing; compute their logical efforts.","assignment":[{"q":"The pull-down network for F = (A·B)' is:","options":["One NMOS","Two NMOS in parallel","Two NMOS in series","Two PMOS in series"],"answer":2,"why":"Output pulls low only when A AND B are high."},{"q":"Unit-drive NAND2 (reference inverter Wn = 1, Wp = 2) uses:","options":["NMOS 2, PMOS 2","NMOS 2, PMOS 4","NMOS 1, PMOS 4","NMOS 1, PMOS 2"],"answer":0,"why":"Series NMOS doubled; parallel PMOS keep width 2."},{"q":"Unit-drive NOR2 uses:","options":["NMOS 2, PMOS 2","NMOS 1, PMOS 4","NMOS 2, PMOS 4","NMOS 1, PMOS 2"],"answer":1,"why":"Series PMOS doubled to 4; parallel NMOS stay 1."},{"q":"Logical effort of a NAND2 is:","options":["4/3","1","5/3","2"],"answer":0,"why":"Cin = 2 + 2 = 4 vs inverter's 3."},{"q":"Logical effort of a NOR2 is:","options":["4/3","1","2","5/3"],"answer":3,"why":"Cin = 1 + 4 = 5 vs 3."},{"q":"Normalised parasitic delay of a NAND2 is about:","options":["1","2","0.5","4/3"],"answer":1,"why":"p ≈ n for an n-input NAND (inverter p ≈ 1)."},{"q":"The pull-down for F = (A·(B + C))' is:","options":["A, B, C all in parallel","A, B, C all in series","A in series with (B ∥ C)","A in parallel with (B series C)"],"answer":2,"why":"AND → series, OR → parallel in the NMOS network."},{"q":"A single static CMOS stage can only implement functions that are:","options":["Sequential","Exclusive-OR only","Inverting (monotone decreasing)","Non-inverting"],"answer":2,"why":"A rising input can only turn on NMOS / turn off PMOS."},{"q":"An inverter (p = 1) driving four identical inverters has delay:","options":["16τ","5τ","4τ","1τ"],"answer":1,"why":"d = g·h + p = 1·4 + 1."},{"q":"NAND is preferred over NOR in CMOS mainly because:","options":["NOR has series PMOS, needing large slow devices","NAND uses fewer NMOS","NAND has zero parasitic delay","NOR has no pull-down"],"answer":0,"why":"Series low-mobility PMOS gives NOR higher logical effort."}],"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":7,"title":"Logical effort & path optimization","videos":[{"id":40,"title":"CombCkt 8 - Logical Effort","youtube":"oUUOkom0otk","duration":"25:31","tutorial":false},{"id":41,"title":"CombCkt 9 - Gate Delay","youtube":"yEVty2fK0JY","duration":"22:42","tutorial":false},{"id":42,"title":"CombCkt 10 - Path Delay Calculation and Optimization","youtube":"4ziVYNz4VSw","duration":"22:37","tutorial":false},{"id":43,"title":"CombCkt 10A - Path Delay Optimization: Intuition","youtube":"BAhZz3kYlqU","duration":"22:19","tutorial":false},{"id":44,"title":"CombCkt 10B - Path Delay Optimization: Example","youtube":"SUrpSL6Tazs","duration":"22:42","tutorial":false},{"id":45,"title":"CombCkt 11 - Buffer Insertion","youtube":"WjxL-Cs2i6o","duration":"27:14","tutorial":false},{"id":46,"title":"CombCkt 12 - Input Ordering and Asymmetric Gates","youtube":"1oe5W-n9i7g","duration":"24:01","tutorial":false},{"id":47,"title":"CombCkt 13 - Skewed Gates","youtube":"XaoV1wxACog","duration":"24:22","tutorial":false}],"notes":[["Path effort","F = G·B·H with G = Π gi, B = Π bi (branching), H = Cout/Cin of the path."],["Minimum delay","Equalise stage efforts: f̂ = F^{1/N}. Then D = N·F^{1/N} + P."],["Best number of stages","Optimal stage effort ≈ 3.6–4, so N̂ ≈ log4(F). Too many stages (f ≪ 4) or too few (f ≫ 4) both cost delay."],["Sizing","Work backward from the load: Cin,i = gi·Cout,i / f̂."],["Buffer insertion","When F is large, add inverters to reach N̂ stages — watch the polarity (even number of extra inverters, or fold one into the logic)."],["Asymmetric & skewed gates","Put the late-arriving input on the transistor nearest the output. Asymmetric gates give the critical input lower g. HI-skew/LO-skew gates strengthen one edge to speed that transition."]],"lab":"Size a 4-stage path (H = 64, G from your gates) by hand with logical effort; check stage efforts are equal.","assignment":[{"q":"A 3-stage inverter chain with H = 64 (G = B = 1, p = 1). Minimum delay = ?","options":["19τ","15τ","12τ","64τ"],"answer":1,"why":"f̂ = 64^{1/3} = 4 → D = 3·4 + 3·1 = 15τ."},{"q":"The delay-optimal stage effort is about:","options":["1","e² ≈ 7.4","4","16"],"answer":2,"why":"ρ ≈ 3.6 for pinv = 1; 4 is the common rule."},{"q":"For path effort F = 256, the best number of stages is about:","options":["2","4","8","16"],"answer":1,"why":"log4(256) = 4."},{"q":"A node drives three equal gates, one of which is on the path. Branching effort b = ?","options":["1","2","3","1/3"],"answer":2,"why":"b = (Con + Coff)/Con = 3C/C."},{"q":"Path NAND2 → NOR2 → inverter. Path logical effort G = ?","options":["20/9 ≈ 2.22","9/20","4/3","3"],"answer":0,"why":"G = (4/3)(5/3)(1)."},{"q":"A late-arriving input should drive the transistor:","options":["With the smallest width","Closest to the output","Closest to the supply rail","On a separate gate"],"answer":1,"why":"Internal nodes nearer the rail are already discharged when it arrives."},{"q":"A HI-skew inverter:","options":["Has no PMOS","Favours the falling output","Favours the rising output (relatively stronger PMOS)","Has equal rise and fall"],"answer":2,"why":"Downsizing the NMOS lowers g for the rising edge."},{"q":"For minimum path delay, stage efforts should be:","options":["Decreasing toward the load","Equal","As small as possible","Increasing toward the load"],"answer":1,"why":"Equalising f minimises N·f under a fixed product F."},{"q":"Last stage: inverter, Cout = 64, f̂ = 4. Its input capacitance = ?","options":["64","16","4","256"],"answer":1,"why":"Cin = g·Cout/f̂ = 64/4."},{"q":"If every stage effort in a path is ~1.5, the path has:","options":["Infinite delay","Optimal sizing","Too many stages — removing some lowers delay","Too few stages"],"answer":2,"why":"f well below 4 means parasitic delay of extra stages dominates."}],"solution":{"youtube":"oZpg3omJFCM","duration":"17:25"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":8,"title":"Ratioed, dynamic & pass-gate logic","videos":[{"id":48,"title":"CombCkt 14 - Special Functions","youtube":"vSwAUT0ymWE","duration":"19:57","tutorial":false},{"id":49,"title":"CombCkt 15 - Pseudo NMOS Logic","youtube":"v2XywtRAHxM","duration":"13:49","tutorial":false},{"id":50,"title":"CombCkt 16 - Pseudo NMOS Inverter","youtube":"u7lZPCFzKPs","duration":"17:23","tutorial":false},{"id":51,"title":"CombCkt 17 - Pseudo NMOS Logical Effort and CVSL","youtube":"mGU0vRd7rzg","duration":"30:10","tutorial":false},{"id":52,"title":"CombCkt 18 - Dynamic Circuits and Input Monotonicity","youtube":"N5vQIMyeA3M","duration":"22:46","tutorial":false},{"id":53,"title":"CombCkt 19 - Domino Logic and Weak Keepers","youtube":"Dkl4N96fHgw","duration":"35:53","tutorial":false},{"id":54,"title":"CombCkt 20 - Transmission Gate Logic","youtube":"EmVLE1RrNmI","duration":"16:56","tutorial":false}],"notes":[["Pseudo-NMOS","Grounded-gate PMOS load + NMOS pull-down. Ratioed: VOL > 0 and static current flows whenever the output is low. Fast falling edge, low input cap."],["CVSL","Cascode voltage switch logic: dual-rail NMOS trees with cross-coupled PMOS loads. No static power, but needs true and complement inputs."],["Dynamic logic","Precharge (clk = 0): output → VDD. Evaluate (clk = 1): conditionally discharge. Inputs must be monotonically rising during evaluation."],["Domino","Dynamic stage + static inverter gives monotonic rising outputs that can drive the next dynamic stage. Only non-inverting functions."],["Keepers & charge sharing","A weak PMOS keeper holds the dynamic node against leakage and charge sharing (charge redistributing onto internal nodes). It must stay weak enough to be overpowered."],["Transmission gates","Parallel NMOS + PMOS with complementary gates; passes full 0 and 1. Efficient for multiplexers and XOR."]],"lab":"Simulate a footed domino AND2 with and without a keeper; observe charge sharing on the dynamic node.","assignment":[{"q":"The main drawback of pseudo-NMOS logic is:","options":["Static power when the output is low (and VOL > 0)","Very high input capacitance","No pull-down network","It needs two clocks"],"answer":0,"why":"The always-on PMOS fights the pull-down."},{"q":"Dynamic-gate inputs must be monotonically rising during evaluation because:","options":["Inputs are precharged too","It reduces leakage","A discharged dynamic node can't be recharged until the next precharge","The PMOS is always on"],"answer":2,"why":"A glitch high-then-low would discharge the node incorrectly and permanently."},{"q":"Domino logic puts a static inverter after each dynamic stage to:","options":["Give monotonically rising outputs for the next stage","Implement XOR","Eliminate the need for precharge","Reduce clock load"],"answer":0,"why":"Precharged-high nodes become low outputs that can only rise."},{"q":"Domino logic can directly implement:","options":["Any function","Only inverting functions","Only sequential functions","Only non-inverting functions"],"answer":3,"why":"Dynamic stage (inverting) + inverter = non-inverting."},{"q":"A keeper in a dynamic gate is:","options":["A weak PMOS that holds the dynamic node high","A strong NMOS footer","A decoupling capacitor","A clock buffer"],"answer":0,"why":"It fights leakage/charge sharing but must be overpowered by the pull-down."},{"q":"Charge sharing in a dynamic gate means:","options":["Supply and ground are shorted","Precharged charge redistributes onto internal nodes, drooping the output","The keeper shares current","Two gates share one clock"],"answer":1,"why":"Internal stack capacitances steal charge when some NMOS turn on."},{"q":"CVSL requires:","options":["A resistive load","True and complement inputs; gives both outputs","A clock","Only one input polarity"],"answer":1,"why":"Dual-rail NMOS trees with cross-coupled PMOS loads."},{"q":"A transmission gate passes:","options":["Neither","Both strong 0 and strong 1","Only a strong 0","Only a strong 1"],"answer":1,"why":"Parallel NMOS + PMOS."},{"q":"During precharge (clk low) in a footed dynamic gate:","options":["Inputs are disconnected from VDD","The dynamic node charges to VDD and the footer is off","Both clocked devices are on","The node discharges to 0"],"answer":1,"why":"The PMOS precharge is on; the NMOS footer blocks the path to ground."},{"q":"The clocked footer NMOS in a dynamic gate:","options":["Prevents a short-circuit path during precharge when inputs are high","Removes the need for a keeper","Speeds up precharge","Implements the logic"],"answer":0,"why":"Without it, high inputs during precharge fight the precharge PMOS."}],"solution":{"youtube":"BO3u3IFBpoE","duration":"14:35"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":9,"title":"Large-circuit sizing & adders","videos":[{"id":55,"title":"CombCkt 21 - Gate Sizing for Large Circuits","youtube":"5V50Erqw8ck","duration":"28:50","tutorial":false},{"id":56,"title":"AM 1 - Ripple Adder Introduction","youtube":"pKK5Y01AZMQ","duration":"21:06","tutorial":false},{"id":57,"title":"AM 2 - Full Adder Circuit Implementation","youtube":"mRfgSX7m_KM","duration":"28:44","tutorial":false},{"id":58,"title":"AM 3 - Full Adder Optimization","youtube":"cavlSAP6KRs","duration":"17:42","tutorial":false},{"id":59,"title":"AM 4 - Carry Skip Adder","youtube":"830K13aHUeM","duration":"27:48","tutorial":false},{"id":60,"title":"AM 5 - Carry Select Adder","youtube":"59DCJRYI4iA","duration":"19:22","tutorial":false},{"id":61,"title":"AM 6 - Linear and Square Root Carry Select Adder","youtube":"gCQvtHhvlY0","duration":"18:22","tutorial":false}],"notes":[["Sizing large circuits","Hand logical effort gives intuition; real designs size the critical paths iteratively, since branches and side loads couple paths."],["Generate / propagate","G = A·B, P = A⊕B (or A+B for carry), K = A'·B'. Cout = G + P·Cin. Ripple-carry delay grows as O(N)."],["Full adder","S = A⊕B⊕C, Cout = MAJ(A,B,C). Majority is self-dual, so the mirror adder uses identical NMOS/PMOS topologies."],["Inverting property","Complementing all inputs complements both S and Cout. Alternate-bit inversion removes inverters from the carry chain."],["Carry-skip","If every P in a block is 1, the block's carry-in skips straight to its carry-out. Worst case: ripple in the first block, skip the middle, ripple in the last."],["Carry-select","Each block precomputes sums for Cin = 0 and 1; a mux picks. Equal blocks → linear; growing block sizes balance arrival → O(√N)."]],"lab":"Build an 8-bit ripple adder in a spreadsheet/Python with gate delays; compare with a 2-block carry-select.","assignment":[{"q":"Ripple-carry adder delay scales as:","options":["O(N)","O(log N)","O(1)","O(√N)"],"answer":0,"why":"The carry passes through every bit."},{"q":"Generate and propagate for one bit are:","options":["G = A⊕B, P = A·B","G = A + B, P = A·B","G = A', P = B'","G = A·B, P = A⊕B"],"answer":3,"why":"Generate makes a carry regardless; propagate passes Cin along."},{"q":"Carry-out in terms of G, P and Cin:","options":["P + G·Cin","G·P + Cin","G + P·Cin","G ⊕ P ⊕ Cin"],"answer":2,"why":"Carry if generated, or propagated from Cin."},{"q":"Full adder with A = B = Cin = 1 gives:","options":["S = 0, Cout = 1","S = 0, Cout = 0","S = 1, Cout = 0","S = 1, Cout = 1"],"answer":3,"why":"1+1+1 = 3 = binary 11."},{"q":"A carry-skip block bypasses its carry when:","options":["Cin is 0","Any generate is 1","All generates are 1","All propagate signals in the block are 1"],"answer":3,"why":"Then Cout,block = Cin,block."},{"q":"A carry-select adder:","options":["Uses a prefix tree","Skips blocks with all P = 1","Is purely ripple","Precomputes sums for Cin = 0 and 1 and muxes"],"answer":3,"why":"Only the mux waits for the real carry."},{"q":"A square-root carry-select adder has delay:","options":["O(√N)","O(log N)","O(N²)","O(N)"],"answer":0,"why":"Growing block sizes balance local sum time against carry arrival."},{"q":"The inverting property of a full adder states:","options":["Complementing all inputs complements S and Cout","Cout ignores Cin","S is always inverted","A and B can be swapped"],"answer":0,"why":"S and majority are both self-dual."},{"q":"The mirror adder's carry circuit is symmetric because:","options":["XOR is symmetric","Majority is self-dual","It uses only NMOS","It is dynamic"],"answer":1,"why":"Pull-up and pull-down share the same topology."},{"q":"Square-root carry-select adders make later blocks larger so that:","options":["The first block is fastest","Power is reduced","Fewer muxes are needed","Each block's sum is ready just as its select carry arrives"],"answer":3,"why":"Later blocks have more time before their carry arrives."}],"solution":{"youtube":"cmtSSvNjrfk","duration":"08:58"},"resources":[["Lecture transcripts & downloads","https://archive.nptel.ac.in/courses/108106158"],["EE5311 course page (IITM)","https://ee.iitm.ac.in/vlsi/courses/ee5311_2020"]]},{"number":10,"title":"Two's complement & multipliers","videos":[{"id":62,"title":"AM 7 - Two's Complement Arithmetic","youtube":"2Uy5T9nRRfg","duration":"26:49","tutorial":false},{"id":63,"title":"AM 8 - Two's Complement Sign Extension","youtube":"zTv_UvI3-X0","duration":"20:02","tutorial":false},{"id":64,"title":"AM 9 - Array Multiplier","youtube":"aNza5NJ-ex8","duration":"18:34","tutorial":false},{"id":65,"title":"AM 10 - Array Multiplier: Timing Analysis","youtube":"HJ54x7P4QBI","duration":"19:27","tutorial":false},{"id":66,"title":"AM 11 - Carry Save Multiplier","youtube":"kR1QXqsHuTM","duration":"17:59","tutorial":false},{"id":67,"title":"AM 12 - Carry Save Multiplier: Signed Multiplication","youtube":"EA9ctQvcp_M","duration":"22:43","tutorial":false}],"notes":[["Two's complement","−x = ~x + 1. An n-bit range is −2^{n−1} … 2^{n−1}−1. One adder handles both addition and subtraction."],["Sign extension","Replicate the MSB when widening. Needed when adding signed operands or partial products of different widths."],["Overflow","Signed overflow only when two operands of the same sign give a result of the opposite sign."],["Array multiplier","N×N partial products a_i·b_j (N² AND gates) summed by rows of adders. Many near-critical paths make it hard to optimise."],["Carry-save multiplier","Carries go diagonally to the next row instead of rippling along the row; a fin
